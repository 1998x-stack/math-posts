<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="q1-title q1-desc"><title id="q1-title">复数 z 等于一加 i 在复平面上的位置</title><desc id="q1-desc">横轴表示实部，纵轴表示虚部。点 z 的坐标为一、一，从原点到点 z 的向量在虚轴方向的坐标是一，因此虚部为一。</desc><rect width="720" height="330" rx="22" fill="#f3f8f7"/><path d="M90 260H650M180 295V35" stroke="#526b74" stroke-width="2.5"/><path d="M642 253l8 7-8 7M173 43l7-8 7 8" fill="none" stroke="#526b74" stroke-width="2"/><path d="M340 260V90M180 90H340" stroke="#a7c9c1" stroke-width="2" stroke-dasharray="7 6"/><path d="M180 260L340 90" stroke="#167d80" stroke-width="5" stroke-linecap="round"/><path d="M326 96l14-6-2 15" fill="none" stroke="#167d80" stroke-width="4"/><circle cx="340" cy="90" r="8" fill="#d77f50" stroke="#fff" stroke-width="3"/><g fill="#234352" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="17"><text x="660" y="266">实轴 Re</text><text x="194" y="31">虚轴 Im</text><text x="168" y="282">O</text><text x="340" y="286" text-anchor="middle">1</text><text x="148" y="96" text-anchor="end">1</text><text x="360" y="82" font-size="20" font-weight="700" fill="#b76a3e">z = 1 + i</text><text x="385" y="124" fill="#167d80" font-weight="700">Im(z) = 1</text><text x="245" y="182" fill="#167d80">从原点指向 z</text></g></svg>
