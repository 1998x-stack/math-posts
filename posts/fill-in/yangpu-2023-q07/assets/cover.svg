<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="q7t q7d"><title id="q7t">分层抽样：84 人队伍中抽出 21 人，男运动员取几人</title><desc id="q7d">比例一致的两条百分比堆叠条，原总体男四十八女三十六，样本男十二女九。</desc><rect width="760" height="360" rx="20" fill="#f4f9f7"/><text x="30" y="40" font-size="22" font-weight="700" fill="#234352">分层抽样：把总体比例原样缩放到样本</text>
