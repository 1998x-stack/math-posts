<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="q5t q5d"><title id="q5t">复数二加二 i 的复平面坐标</title><desc id="q5d">复数 z 等于二加二 i 对应点二二，横坐标实部为二，纵坐标虚部为二。</desc><rect width="720" height="310" rx="20" fill="#f4f9f7"/><text x="36" y="38" font-size="20" font-weight="700" fill="#234352">复数的虚部，是复平面点的纵坐标</text><path d="M115 255H635M175 290V58" stroke="#526b74" stroke-width="2.5"/><path d="M625 247l10 8-10 8M167 67l8 -10 8 10" stroke="#526b74" stroke-width="2" fill="none"/><path d="M175 255L375 95" stroke="#167d80" stroke-width="5"/><path d="M375 255V95H175" stroke="#d9825c" stroke-width="3" stroke-dasharray="7 5" fill="none"/><circle cx="375" cy="95" r="9" fill="#167d80" stroke="white" stroke-width="2"/><g fill="#234352" font-size="16"><text x="640" y="262">实轴 Re</text><text x="185" y="56">虚轴 Im</text><text x="158" y="276">O</text><text x="375" y="279" text-anchor="middle">2</text><text x="150" y="100" text-anchor="end">2</text><text x="392" y="90" font-weight="700">z = 2 + 2i</text><text x="392" y="120" fill="#167d80">Re(z)=2，Im(z)=2</text></g></svg>
