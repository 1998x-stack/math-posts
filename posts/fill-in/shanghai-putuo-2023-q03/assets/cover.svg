<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="q3-title q3-desc"><title id="q3-title">不等式解集为一到正无穷的开区间</title><desc id="q3-desc">数轴上零点零被标记为定义域排除点，一是函数值为零的边界点。只有一的右侧涂色，表示严格不等式的解集为开区间一到正无穷。</desc><rect width="720" height="300" rx="22" fill="#f3f8f7"/><path d="M70 158H650" stroke="#526b74" stroke-width="3"/><path d="M640 150l10 8-10 8" fill="none" stroke="#526b74" stroke-width="2"/><path d="M430 158H620" stroke="#167d80" stroke-width="10" stroke-linecap="round"/><path d="M180 144V172M430 144V172" stroke="#526b74" stroke-width="2"/><circle cx="180" cy="158" r="9" fill="#fff" stroke="#c87948" stroke-width="3"/><circle cx="430" cy="158" r="9" fill="#fff" stroke="#167d80" stroke-width="3"/><g fill="#234352" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="18"><text x="180" y="202" text-anchor="middle">0（不在定义域）</text><text x="430" y="202" text-anchor="middle">1（边界不取）</text><text x="540" y="128" text-anchor="middle" fill="#167d80" font-weight="700">解集</text><text x="630" y="190">+∞</text><text x="70" y="48" font-size="21" font-weight="700">f(x) &lt; 0 ⇔ 1 − x⁵ &lt; 0 ⇔ x &gt; 1</text><text x="70" y="254" font-size="16" fill="#60777c">注意：x = 0 处无定义；x = 1 处函数值为 0。</text></g></svg>
