<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="q1-title q1-desc"><title id="q1-title">分式不等式解集为负二到零的左开右闭区间</title><desc id="q1-desc">数轴上负二处为空心点，零处为实心点，两点之间线段表示解集；三个区间上的分式符号依次为正、负、正。</desc><rect width="760" height="300" rx="22" fill="#f4f9f7"/><path d="M78 128H690" stroke="#526b74" stroke-width="2"/><path d="M682 121l9 7-9 7" fill="none" stroke="#526b74" stroke-width="2"/><path d="M300 128H500" stroke="#167d80" stroke-width="10" stroke-linecap="round"/><path d="M300 80V176M500 80V176" stroke="#a9b9bd" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="300" cy="128" r="10" fill="#fff" stroke="#d9825c" stroke-width="4"/><circle cx="500" cy="128" r="10" fill="#167d80"/><g fill="#234352" font-family="system-ui,'PingFang SC',sans-serif" font-size="17"><text x="300" y="205" text-anchor="middle">−2（分母为 0）</text><text x="500" y="205" text-anchor="middle">0（分子为 0）</text><text x="170" y="105" text-anchor="middle" fill="#b36b42">正</text><text x="400" y="105" text-anchor="middle" fill="#167d80" font-weight="700">负</text><text x="610" y="105" text-anchor="middle" fill="#b36b42">正</text><text x="400" y="250" text-anchor="middle" font-size="20" font-weight="700">解集：(−2, 0]</text><text x="28" y="282" font-size="13">空心端点不取；实心端点可取</text></g></svg>