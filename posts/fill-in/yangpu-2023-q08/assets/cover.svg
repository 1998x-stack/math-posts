<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="q8t q8d"><title id="q8t">同一组渐近线，为什么双曲线有两种离心率</title><desc id="q8d">两组双曲线都以正负四分之三为渐近线斜率，但实轴水平或竖直产生不同离心率。</desc><rect width="760" height="360" rx="20" fill="#f4f9f7"/><text x="35" y="38" font-size="20" font-weight="700" fill="#234352">同一对渐近线 ≠ 唯一开口方向</text><path d="M380 56V343" stroke="#d5e3df" stroke-width="2"/>
