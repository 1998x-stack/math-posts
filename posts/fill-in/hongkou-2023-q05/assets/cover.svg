<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="q5-title q5-desc"><title id="q5-title">复数根一减根号三 i 与其共轭关于实轴对称</title><desc id="q5-desc">复平面上两个根对应点一正负根号三，关于实轴对称，并且都在以原点为圆心、半径二的圆上。</desc><rect width="760" height="340" rx="22" fill="#f4f9f7"/><circle cx="270" cy="170" r="150" fill="none" stroke="#b9d5cf" stroke-width="2" stroke-dasharray="7 6"/><path d="M70 170H650M270 30V310" stroke="#526b74" stroke-width="2"/><path d="M642 163l9 7-9 7M263 38l7-9 7 9" fill="none" stroke="#526b74" stroke-width="2"/><path d="M270 170L345 40M270 170L345 300" stroke="#d9825c" stroke-width="3"/><path d="M345 40V300" stroke="#167d80" stroke-width="2" stroke-dasharray="6 5"/><circle cx="345" cy="40" r="7" fill="#167d80" stroke="#fff" stroke-width="2"/><circle cx="345" cy="300" r="7" fill="#d9825c" stroke="#fff" stroke-width="2"/><circle cx="270" cy="170" r="5" fill="#234352"/><g fill="#234352" font-family="system-ui,'PingFang SC',sans-serif" font-size="16"><text x="255" y="192" text-anchor="end">O</text><text x="345" y="326" text-anchor="middle">1</text><text x="360" y="44" fill="#167d80">1+√3i</text><text x="360" y="304" fill="#b36b42">1−√3i</text><text x="660" y="174">实轴</text><text x="282" y="28">虚轴</text><text x="100" y="72" font-size="18" font-weight="700">共轭根关于实轴对称</text><text x="90" y="100">|z| = √(1+3) = 2</text></g></svg>