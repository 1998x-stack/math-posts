<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="S₂=2a₁+d，S₃=3a₁+3d。2S₃减去3S₂后首项消失，只余3d。"><title>等差数列前二项和前三项和的代数拆分</title><desc>S₂=2a₁+d，S₃=3a₁+3d。2S₃减去3S₂后首项消失，只余3d。</desc><rect width="760" height="360" rx="24" fill="#f3faf7"/><text x="52" y="62" font-size="23" fill="#2f5660" font-weight="700">三项等差数列：a₁，a₁+d，a₁+2d</text><g font-family="system-ui,sans-serif" font-size="18" text-anchor="middle"><rect x="70" y="105" width="184" height="75" rx="12" fill="#d7ebef"/><rect x="285" y="105" width="184" height="75" rx="12" fill="#cce7dc"/><rect x="500" y="105" width="184" height="75" rx="12" fill="#f6e4d4"/><text x="162" y="151" fill="#365369">a₁</text><text x="377" y="151" fill="#365369">a₁+d</text><text x="592" y="151" fill="#365369">a₁+2d</text></g><path d="M72 207H467M72 217v-20M467 217v-20" stroke="#178b80" stroke-width="3"/><text x="237" y="241" font-size="19" text-anchor="middle" fill="#178b80">S₂ = 2a₁ + d</text><path d="M72 273H682M72 282v-18M682 282v-18" stroke="#c07e4f" stroke-width="3"/><text x="381" y="308" text-anchor="middle" font-size="19" fill="#ab7146">S₃ = 3a₁ + 3d</text><text x="212" y="342" font-size="19" fill="#285663">2S₃ − 3S₂ = 3d = 6</text></svg>