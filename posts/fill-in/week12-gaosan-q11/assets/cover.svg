<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="q11t q11d"><title id="q11t">两个单位向量夹角120度实现数量积最小值</title><desc id="q11d">两个单位向量b向右和c向左上成120度；橙色向量a等于c减b，长度根号三。a加2b等于b加c。此时b点c为负二分之一。</desc><rect width="860" height="400" rx="20" fill="#f3f9f6"/><rect x="22" y="22" width="465" height="355" rx="14" fill="#fff" stroke="#d7e6df"/><rect x="510" y="22" width="328" height="355" rx="14" fill="#fff" stroke="#d7e6df"/><defs><marker id="ma11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c9804a"/></marker><marker id="mb11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#168878"/></marker><marker id="mc11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5875a2"/></marker></defs><g fill="none" stroke-width="4"><path d="M279 280L399 280" stroke="#168878" marker-end="url(#mb11)"/><path d="M279 280L219 176.08" stroke="#5875a2" marker-end="url(#mc11)"/><path d="M279 280L99 176.08" stroke="#c9804a" marker-end="url(#ma11)"/><path d="M279 280L339 176.08" stroke="#a4944c" stroke-dasharray="8 6"/></g><path d="M318 280A39 39 0 0 0 259.5 246.2" fill="none" stroke="#8da2a0" stroke-width="2.5"/><circle cx="279" cy="280" r="5" fill="#51666b"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#264853" font-size="19"><text x="43" y="57" font-size="23" font-weight="700">取等时：120°</text><text x="405" y="287" fill="#087a71">b</text><text x="199" y="163" fill="#5875a2">c</text><text x="42" y="162" fill="#bb7641">a = c − b</text><text x="341" y="166" fill="#9c8443">b+c</text><text x="314" y="225">120°</text><text x="275" y="307">O</text><text x="47" y="351" font-size="17">|b|=|c|=1，|a|=√3</text><text x="533" y="61" font-size="23" font-weight="700">正交分解</text><text x="532" y="109" fill="#087a71">b+c ⟂ b−c</text><text x="532" y="162">|b−c|² = 2−2t</text><text x="532" y="217">3 ≥ 2−2t</text><text x="532" y="272" font-size="28" font-weight="700" fill="#b16e3d">t ≥ −1/2</text><text x="532" y="334" font-size="16">λ=1 时能取等</text></g></svg>
