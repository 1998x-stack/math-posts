<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="w6t w6d"><title id="w6t">圆锥轴截面与半圆展开图对应</title><desc id="w6d">左图圆锥底面半径1、母线2、高根号3；右图侧面为半径2的半圆扇形，面积等于2π。</desc><rect width="860" height="400" rx="22" fill="#f2f9f6"/><rect x="24" y="24" width="380" height="350" rx="16" fill="#fff" stroke="#dcebe6"/><rect x="426" y="24" width="410" height="350" rx="16" fill="#fff" stroke="#dcebe6"/><g fill="#244654" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="21" font-weight="700"><text x="48" y="64">立体圆锥的轴截面</text><text x="455" y="64">侧面展开为半圆扇形</text></g><path d="M210 100L105 302Q210 352 315 302Z" fill="#dcf1e9" stroke="#15877a" stroke-width="3"/><path d="M105 302Q210 259 315 302" fill="none" stroke="#69868b" stroke-width="2" stroke-dasharray="6 5"/><path d="M210 100V302H315" fill="none" stroke="#c77d4a" stroke-width="3"/><path d="M210 282H230V302" fill="none" stroke="#c77d4a" stroke-width="2"/><g fill="#254752" font-family="system-ui,sans-serif" font-size="20"><text x="268" y="195" fill="#08776e">母线 l = 2</text><text x="170" y="212" fill="#bb7645">h = √3</text><text x="253" y="330">r = 1</text><text x="60" y="358" font-size="15">h² + r² = l²</text></g><path d="M630 285L505 285A125 125 0 0 1 755 285Z" fill="#dcefeb" stroke="#17877a" stroke-width="3"/><path d="M630 285V160M630 285H755" stroke="#c77d4a" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="630" cy="285" r="5" fill="#c77d4a"/><g fill="#254752" font-family="system-ui,sans-serif" font-size="20"><text x="639" y="153">S = 2π</text><text x="665" y="314">半径 l = 2</text><text x="575" y="309">θ = π</text><text x="464" y="358" font-size="16">弧长 = 底面周长 = 2π</text></g></svg>
