<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="q12c-t q12c-d"><title id="q12c-t">开区间 B 与有限集合 A 的交集示意</title><desc id="q12c-d">B 等于负一到二分之一的不含端点区间；A 包含负二、零、一，只有零落在B的范围里。</desc><rect width="720" height="345" rx="22" fill="#f3f9f7"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244454" font-size="22" font-weight="700"><text x="57" y="55">B：严格小于零的解集</text><text x="57" y="210">A：仅含三个数</text><text x="387" y="323" fill="#137d72">A ∩ B = {0}</text></g><rect x="285" y="79" width="188" height="68" rx="11" fill="#daf2e9"/><path d="M100 147H649M100 253H649" stroke="#556f75" stroke-width="2.7"/><path d="M640 140l9 7-9 7M640 246l9 7-9 7" fill="none" stroke="#556f75" stroke-width="2.7"/><path d="M285 147H473" stroke="#13897c" stroke-width="9"/><circle cx="285" cy="147" r="10" fill="#fff" stroke="#13897c" stroke-width="4"/><circle cx="473" cy="147" r="10" fill="#fff" stroke="#13897c" stroke-width="4"/><g font-family="system-ui,sans-serif" font-size="19" text-anchor="middle" fill="#244454"><text x="160" y="178">−2</text><text x="285" y="178">−1</text><text x="410" y="178">0</text><text x="473" y="178">½</text><text x="535" y="178">1</text><text x="160" y="282">−2</text><text x="285" y="282">−1</text><text x="410" y="282">0</text><text x="473" y="282">½</text><text x="535" y="282">1</text></g><path d="M410 154V237" stroke="#cc7d45" stroke-width="2" stroke-dasharray="5 5"/><circle cx="160" cy="253" r="11" fill="#7e9095"/><circle cx="535" cy="253" r="11" fill="#7e9095"/><circle cx="410" cy="253" r="13" fill="#d78549" stroke="#fff" stroke-width="3"/><text x="434" y="248" fill="#ae6032" font-size="17" font-family="system-ui,sans-serif">唯一重合</text></svg>
