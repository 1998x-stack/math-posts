<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="q11-title q11-desc">
<title id="q11-title">等差数列前项和的对称值：只有四组重复</title>
<desc id="q11-desc">横轴是整数下标 n，纵轴是归一化的 2S_n 除以 d，即 n 乘以 n 减 10。抛物线关于 n 等于 5 对称，标出 1 与 9、2 与 8、3 与 7、4 与 6 四组重复值；n 从 11 起为不同的正值。</desc>
<rect width="760" height="400" rx="18" fill="#f5f9f7"/>
<text x="28" y="38" font-size="22" font-weight="700" fill="#234352">把 Sₙ 化成关于 n 的对称二次式</text>
<text x="28" y="67" font-size="17" fill="#375360">纵轴画的是 2Sₙ/d = n(n−10)，不受 d 正负影响</text>
<g stroke="#d9e5e1" stroke-width="1"><path d="M75 100H700"/><path d="M75 160H700"/><path d="M75 230H700"/><path d="M75 300H700"/></g>
<path d="M75 230H700" stroke="#657d80" stroke-width="2"/>
<path d="M264 86V322" stroke="#d9825c" stroke-width="2" stroke-dasharray="6 5"/>
<text x="274" y="96" font-size="15" fill="#a85b3a">对称轴 n=5</text>
<text x="82" y="220" font-size="13" fill="#657d80">0</text>
<text x="82" y="292" font-size="13" fill="#657d80">−25</text>
<text x="82" y="155" font-size="13" fill="#657d80">25</text>
<path d="M80 255.2 L126 274 L172 288 L218 296.8 L264 300 L310 296.8 L356 288 L402 274 L448 255.2 L494 230 L540 199.2 L586 162.8 L632 120.8 L678 73.2" fill="none" stroke="#7ba9a2" stroke-width="2.5" stroke-dasharray="5 5"/>
<g fill="#167d80" stroke="#ffffff" stroke-width="2">
<circle cx="80" cy="255.2" r="6"/><circle cx="126" cy="274" r="6"/><circle cx="172" cy="288" r="6"/><circle cx="218" cy="296.8" r="6"/>
<circle cx="310" cy="296.8" r="6"/><circle cx="356" cy="288" r="6"/><circle cx="402" cy="274" r="6"/><circle cx="448" cy="255.2" r="6"/>
</g>
<g fill="#d9825c" stroke="#ffffff" stroke-width="2"><circle cx="264" cy="300" r="7"/><circle cx="494" cy="230" r="7"/></g>
<g fill="#234352" font-size="15" font-weight="700">
<text x="80" y="242" text-anchor="middle">1=9</text><text x="126" y="261" text-anchor="middle">2=8</text>
<text x="172" y="275" text-anchor="middle">3=7</text><text x="218" y="284" text-anchor="middle">4=6</text>
<text x="264" y="322" text-anchor="middle">5</text><text x="494" y="215" text-anchor="middle">10</text>
</g>
<g fill="#167d80" font-size="14"><circle cx="540" cy="199.2" r="5"/><circle cx="586" cy="162.8" r="5"/><circle cx="632" cy="120.8" r="5"/><circle cx="678" cy="73.2" r="5"/>
<text x="540" y="187" text-anchor="middle">11</text><text x="586" y="151" text-anchor="middle">12</text><text x="632" y="109" text-anchor="middle">13</text><text x="678" y="61" text-anchor="middle">14</text></g>
<path d="M75 230V322" stroke="#657d80" stroke-width="1.5"/>
<text x="690" y="250" text-anchor="end" font-size="14" fill="#657d80">n</text>
<text x="380" y="365" text-anchor="middle" font-size="17" font-weight="700" fill="#234352">四组镜像下标共享数值；其余下标各自产生新值</text>
</svg>