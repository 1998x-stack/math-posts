<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="按红球个数分类计数"><title>红球个数分类</title><desc>零个红球有二百零八种，一 个红球有二百六十四种，合计四百七十二种。</desc><rect width="720" height="300" rx="20" fill="#f4f9f7"/><rect x="245" y="22" width="230" height="48" rx="12" fill="#e7f2ee" stroke="#c3ddd4"/><text x="360" y="52" text-anchor="middle" fill="#234352" font-size="18" font-family="system-ui,sans-serif">按红球个数分类</text><path d="M360 70V95M180 95H540M180 95V120M540 95V120" fill="none" stroke="#8aa9a3" stroke-width="2"/><rect x="55" y="120" width="250" height="105" rx="12" fill="#edf5f2" stroke="#b8d8ce"/><rect x="415" y="120" width="250" height="105" rx="12" fill="#fff3e8" stroke="#ead1ba"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="180" y="150" fill="#234352" font-size="17">0 个红球</text><text x="180" y="195" fill="#167d80" font-size="28" font-weight="700">208</text><text x="540" y="150" fill="#234352" font-size="17">1 个红球</text><text x="540" y="195" fill="#a45e3c" font-size="28" font-weight="700">264</text></g><path d="M180 225V250H540V225M360 250V265" stroke="#8aa9a3" stroke-width="2" fill="none"/><text x="360" y="289" text-anchor="middle" fill="#234352" font-size="21" font-family="system-ui,sans-serif" font-weight="700">208 + 264 = 472</text></svg>