<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="q1t q1d"><title id="q1t">立方差的正因子分解</title><desc id="q1d">b 在实数轴上位于 a 左侧，a 减 b 为正；立方差分解成两个严格正因子，因此 a 的立方大于 b 的立方。</desc><rect width="720" height="300" rx="20" fill="#f4f9f7"/><text x="36" y="38" font-size="20" font-weight="700" fill="#234352">从 a &gt; b 推出 a³ &gt; b³</text><path d="M90 95H630m-12 -8 12 8-12 8" stroke="#526b74" stroke-width="3" fill="none"/><circle cx="245" cy="95" r="8" fill="#d9825c"/><circle cx="475" cy="95" r="8" fill="#167d80"/><g font-size="18" fill="#234352"><text x="245" y="126" text-anchor="middle">b</text><text x="475" y="126" text-anchor="middle">a</text><text x="360" y="78" text-anchor="middle" fill="#167d80">a − b &gt; 0</text></g><rect x="65" y="160" width="275" height="70" rx="12" fill="#e5f2ed" stroke="#8ebcaf" stroke-width="2"/><rect x="380" y="160" width="275" height="70" rx="12" fill="#e8eff7" stroke="#9eb8d4" stroke-width="2"/><g text-anchor="middle" font-size="18"><text x="202" y="188" fill="#176c68">第一个因子</text><text x="202" y="215" fill="#234352" font-weight="700">a − b &gt; 0</text><text x="517" y="188" fill="#456f9c">第二个因子</text><text x="517" y="215" fill="#234352" font-weight="700">a² + ab + b² &gt; 0</text></g><path d="M202 232V258H360M517 232V258H360" fill="none" stroke="#526b74" stroke-width="2"/><rect x="260" y="250" width="200" height="38" rx="10" fill="#167d80"/><text x="360" y="276" text-anchor="middle" fill="white" font-size="19" font-weight="700">a³ − b³ &gt; 0</text></svg>
