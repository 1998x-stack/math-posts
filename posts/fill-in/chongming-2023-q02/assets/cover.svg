<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title-q2 desc-q2"><title id="title-q2">分式不等式的符号数轴</title><desc id="desc-q2">数轴三段的分式符号依次为正、负、正。负二分之一与二均为空心端点，中间为绿色解集。</desc><rect width="720" height="320" rx="22" fill="#f4f9f7"/><rect x="258" y="142" width="331" height="34" rx="10" fill="#cceae2"/><path d="M68 159H661" stroke="#526f79" stroke-width="2"/><path d="M654 153l7 6l-7 6" fill="none" stroke="#526f79" stroke-width="2"/><path d="M259 117V184M589 117V184" stroke="#188579" stroke-dasharray="5 5" stroke-width="2"/><circle cx="259" cy="159" r="9" fill="#fff" stroke="#d47c54" stroke-width="3"/><circle cx="589" cy="159" r="9" fill="#fff" stroke="#d47c54" stroke-width="3"/><text x="259" y="209" text-anchor="middle" fill="#385863" font-size="17" font-family="system-ui,sans-serif">−1/2</text><text x="589" y="209" text-anchor="middle" fill="#385863" font-size="17" font-family="system-ui,sans-serif">2</text><text x="151" y="107" text-anchor="middle" fill="#476973" font-size="31" font-weight="700" font-family="system-ui,sans-serif">+</text><text x="424" y="107" text-anchor="middle" fill="#b96544" font-size="31" font-weight="700" font-family="system-ui,sans-serif">−</text><text x="628" y="107" text-anchor="middle" fill="#476973" font-size="31" font-weight="700" font-family="system-ui,sans-serif">+</text><text x="356" y="53" text-anchor="middle" fill="#24525b" font-size="21" font-weight="700" font-family="system-ui,sans-serif">R(x) = (2x + 1) / (x − 2)</text><text x="357" y="259" text-anchor="middle" fill="#117b70" font-size="17" font-family="system-ui,sans-serif">绿色区间：分子为正，分母为负</text><text x="359" y="289" text-anchor="middle" fill="#506c74" font-size="15" font-family="system-ui,sans-serif">两个空心端点分别使分式为 0 与无定义</text></svg>
