<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="q12t q12d"><title id="q12t">标准绝对值正弦在一个波峰区间内与水平线相交两次</title><desc id="q12d">u从0到π，曲线|sin u|从0升到1再降到0；水平线m=0.5有两个交点，m=0时两个交点是区间端点。</desc><rect width="720" height="340" rx="20" fill="#f4f9f7"/><path d="M80 265H650M100 285V38" stroke="#526b74" stroke-width="2"/><path d="M100 265 C145 110 230 65 360 65 C490 65 575 110 620 265" fill="none" stroke="#167e85" stroke-width="5"/><path d="M100 165H620" stroke="#d9825c" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="186.7" cy="165" r="7" fill="#d9825c"/><circle cx="533.3" cy="165" r="7" fill="#d9825c"/><circle cx="100" cy="265" r="6" fill="#234352"/><circle cx="620" cy="265" r="6" fill="#234352"/><path d="M100 292H620M100 286V298M620 286V298" stroke="#526b74" stroke-width="2"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="15"><text x="100" y="318" text-anchor="middle">u=0</text><text x="360" y="318" text-anchor="middle">u=π/2</text><text x="620" y="318" text-anchor="middle">u=π</text><text x="630" y="169">m=0.5</text><text x="360" y="44" text-anchor="middle">|sin u|</text><text x="360" y="205" text-anchor="middle" fill="#a45e3c">恰有两个交点</text><text x="100" y="248" text-anchor="middle">m=0 的第1根</text><text x="620" y="248" text-anchor="middle">第2根</text></g><path d="M186.7 165V265M533.3 165V265" stroke="#d9825c" stroke-dasharray="4 5"/></svg>