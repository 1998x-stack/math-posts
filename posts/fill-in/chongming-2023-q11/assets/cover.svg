<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="q11title q11desc"><title id="q11title">正六边形中向量点积的极值</title><desc id="q11desc">边长为二的正六边形 ABCDEF，A 和 D 是线性函数向量AD点乘向量BP的最小值与最大值顶点，P示意取中心。通过A和D、垂直于AD的两条支撑线展示线性函数的两个极值端点。</desc><defs><marker id="q11a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167f79"/></marker><marker id="q11b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d87952"/></marker></defs><rect width="720" height="360" rx="22" fill="#f5f9f7"/><path d="M300 294L420 294L480 190L420 86L300 86L240 190Z" fill="#dceee8" stroke="#277f78" stroke-width="3"/><path d="M257 269L343 319M377 61L463 111" stroke="#d87952" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M300 294L420 86" stroke="#167f79" stroke-width="4" marker-end="url(#q11a)"/><path d="M420 294L360 190" stroke="#d87952" stroke-width="4" marker-end="url(#q11b)"/><circle cx="360" cy="190" r="7" fill="#d87952" stroke="white" stroke-width="3"/><text x="288" y="314" fill="#a65336" font-size="17" font-weight="700" font-family="system-ui,sans-serif">A · 最小 −4</text><text x="431" y="72" fill="#16766f" font-size="17" font-weight="700" font-family="system-ui,sans-serif">D · 最大 12</text><text x="368" y="181" fill="#a65336" font-size="18" font-weight="700" font-family="system-ui,sans-serif">P</text><text x="423" y="317" fill="#365d68" font-size="18" font-weight="700" font-family="system-ui,sans-serif">B</text><text x="491" y="190" fill="#365d68" font-size="18" font-weight="700" font-family="system-ui,sans-serif">C</text><text x="286" y="76" fill="#365d68" font-size="18" font-weight="700" font-family="system-ui,sans-serif">E</text><text x="215" y="190" fill="#365d68" font-size="18" font-weight="700" font-family="system-ui,sans-serif">F</text><text x="245" y="281" fill="#365d68" font-size="17" font-family="system-ui,sans-serif">A</text><text x="390" y="170" fill="#16766f" font-size="16" font-weight="700" font-family="system-ui,sans-serif">AD</text><text x="390" y="270" fill="#b65e3d" font-size="16" font-weight="700" font-family="system-ui,sans-serif">BP</text><text x="360" y="344" text-anchor="middle" fill="#4d6972" font-size="15" font-family="system-ui,sans-serif">虚线垂直于 AD；沿 AD 边移动 P 可取遍整个闭区间</text></svg>
