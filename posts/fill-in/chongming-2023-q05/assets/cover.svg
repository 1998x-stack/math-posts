<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title-q5 desc-q5"><title id="title-q5">等比数列负公比的符号交替</title><desc id="desc-q5">前四项为一负二四负八。每项均将前项乘以负二；绿色在基线上方，橙色在基线下方。</desc><rect width="720" height="320" rx="22" fill="#f4f9f7"/><path d="M73 145H660" stroke="#526e77" stroke-width="2"/><rect x="111" y="130" width="68" height="15" rx="6" fill="#239187"/><text x="145" y="119" text-anchor="middle" fill="#274b55" font-size="19" font-weight="700" font-family="system-ui,sans-serif">1</text><text x="145" y="308" text-anchor="middle" fill="#345e68" font-size="18" font-family="system-ui,sans-serif">a₁</text><rect x="251" y="145" width="68" height="30" rx="6" fill="#d98159"/><text x="285" y="196" text-anchor="middle" fill="#274b55" font-size="19" font-weight="700" font-family="system-ui,sans-serif">-2</text><text x="285" y="308" text-anchor="middle" fill="#345e68" font-size="18" font-family="system-ui,sans-serif">a₂</text><rect x="391" y="85" width="68" height="60" rx="6" fill="#239187"/><text x="425" y="74" text-anchor="middle" fill="#274b55" font-size="19" font-weight="700" font-family="system-ui,sans-serif">4</text><text x="425" y="308" text-anchor="middle" fill="#345e68" font-size="18" font-family="system-ui,sans-serif">a₃</text><rect x="531" y="145" width="68" height="120" rx="6" fill="#d98159"/><text x="565" y="286" text-anchor="middle" fill="#274b55" font-size="19" font-weight="700" font-family="system-ui,sans-serif">-8</text><text x="565" y="308" text-anchor="middle" fill="#345e68" font-size="18" font-family="system-ui,sans-serif">a₄</text><path d="M193 65H235l-8 -6m8 6l-8 6" fill="none" stroke="#436974" stroke-width="2"/><text x="215" y="47" text-anchor="middle" fill="#345e68" font-size="16" font-family="system-ui,sans-serif">×(−2)</text><path d="M333 65H375l-8 -6m8 6l-8 6" fill="none" stroke="#436974" stroke-width="2"/><text x="355" y="47" text-anchor="middle" fill="#345e68" font-size="16" font-family="system-ui,sans-serif">×(−2)</text><path d="M473 65H515l-8 -6m8 6l-8 6" fill="none" stroke="#436974" stroke-width="2"/><text x="495" y="47" text-anchor="middle" fill="#345e68" font-size="16" font-family="system-ui,sans-serif">×(−2)</text><text x="360" y="24" text-anchor="middle" fill="#274c58" font-size="20" font-weight="700" font-family="system-ui,sans-serif">q = −2：符号交替，绝对值倍增</text><text x="361" y="282" text-anchor="middle" fill="#54727e" font-size="15" font-family="system-ui,sans-serif">柱高表示绝对值，上下位置表示正负</text></svg>
