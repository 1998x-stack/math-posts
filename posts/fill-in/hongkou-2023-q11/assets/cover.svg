<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">外心三角形与向量参数扫出的平行四边形</title><desc id="fig-desc">左图为边长五、六、七的三角形ABC及外心O；右图以OB和OC为两条邻边，参数x和y分别从零到一时，点P扫过平行四边形OBDC，面积为49根号六除以二十四。</desc><defs><marker id="arrow11" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#167d80"/></marker></defs><rect width="960" height="500" rx="24" fill="#f5faf7"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="42" y="43" font-size="23" font-weight="750" fill="#214953">① 先由三角形确定外接圆半径</text><text x="520" y="43" font-size="23" font-weight="750" fill="#214953">② 再看向量线性组合的轨迹</text><rect x="25" y="65" width="450" height="395" rx="18" fill="#fff" stroke="#dbe9e2"/><rect x="495" y="65" width="440" height="395" rx="18" fill="#fff" stroke="#dbe9e2"/><circle cx="240" cy="232.3" r="185.7" fill="none" stroke="#a8c9bd" stroke-width="2" stroke-dasharray="6 5"/><path d="M110 365L370 365L172.4 59.4Z" fill="#eaf3ee" stroke="#386d70" stroke-width="2.8"/><path d="M240 232.3L110 365M240 232.3L370 365M240 232.3L172.4 59.4" stroke="#c18b56" stroke-width="1.8" stroke-dasharray="5 5"/><circle cx="240" cy="232.3" r="5.5" fill="#c18b56"/><g fill="#274e57" font-size="18" font-weight="650"><text x="88" y="389">A</text><text x="374" y="389">B</text><text x="164" y="48">C</text><text x="250" y="252">O</text></g><g fill="#657b80" font-size="15"><text x="226" y="389">AB = 5</text><text x="101" y="218">AC = 6</text><text x="300" y="191">BC = 7</text><text x="47" y="438">R = 35/(4√6)</text></g><path d="M700 265L820 387.5L757.6 228.2L637.6 105.4Z" fill="#dcefe7" stroke="#167d80" stroke-width="2.8"/><path d="M700 265L820 387.5" stroke="#167d80" stroke-width="3" marker-end="url(#arrow11)"/><path d="M700 265L637.6 105.4" stroke="#c18b56" stroke-width="3" marker-end="url(#arrow11)"/><path d="M820 387.5L757.6 228.2M637.6 105.4L757.6 228.2" stroke="#8baaa1" stroke-width="1.8" stroke-dasharray="5 5"/><g fill="#274e57" font-size="18" font-weight="650"><text x="682" y="286">O</text><text x="827" y="399">B</text><text x="619" y="98">C</text><text x="766" y="222">D</text></g><g font-size="16" font-weight="650"><text x="784" y="325" fill="#167d80">x·OB</text><text x="622" y="190" fill="#a56f42">y·OC</text></g><text x="715" y="430" text-anchor="middle" font-size="15" fill="#557078">0 ≤ x,y ≤ 1</text><text x="715" y="451" text-anchor="middle" font-size="17" font-weight="750" fill="#167d80">面积 = |OB × OC|</text></g></svg>