<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="球半径三由体积反求"><title>球的体积到表面积</title><desc>球的截面半径为三，计算路径为体积三十六π，半径三，表面积三十六π。</desc><rect width="720" height="300" rx="20" fill="#f4f9f7"/><circle cx="190" cy="145" r="100" fill="#bfe0e5" fill-opacity=".6" stroke="#287d88" stroke-width="4"/><ellipse cx="190" cy="145" rx="100" ry="28" fill="none" stroke="#287d88" stroke-dasharray="7 5" stroke-width="2"/><path d="M190 145H290" stroke="#d9825c" stroke-width="4"/><circle cx="190" cy="145" r="6" fill="#234352"/><text x="235" y="132" fill="#a45e3c" font-size="18" font-weight="700">r=3</text><g fill="#234352" font-family="system-ui,sans-serif"><rect x="370" y="40" width="285" height="58" rx="12" fill="#e7f2ee"/><rect x="370" y="120" width="285" height="58" rx="12" fill="#fff3e8"/><rect x="370" y="200" width="285" height="58" rx="12" fill="#e7f2ee"/><text x="390" y="76" font-size="20">V = 36π</text><text x="390" y="156" font-size="20">r = 3</text><text x="390" y="236" font-size="20">S = 4πr² = 36π</text></g><path d="M512 98V118M512 178V198" stroke="#167d80" stroke-width="3"/></svg>