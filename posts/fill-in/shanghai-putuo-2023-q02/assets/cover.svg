<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="q2-title q2-desc"><title id="q2-title">底面边长为一、高为二的正四棱柱</title><desc id="q2-desc">正四棱柱的底面是正方形，底面周长四等分为四条边，每条边长一。竖直棱高为二，底面积一乘一，体积为二。</desc><rect width="720" height="340" rx="22" fill="#f3f8f7"/><polygon points="170,248 420,248 480,190 230,190" fill="#cfe6de" stroke="#3e7372" stroke-width="2.5"/><polygon points="170,78 420,78 480,20 230,20" fill="#e8f2ee" stroke="#3e7372" stroke-width="2.5"/><polygon points="170,78 420,78 420,248 170,248" fill="#dcefe8" stroke="#3e7372" stroke-width="2.5"/><polygon points="420,78 480,20 480,190 420,248" fill="#c3dfd5" stroke="#3e7372" stroke-width="2.5"/><path d="M170 248V78M420 248V78M480 190V20M230 190V20" fill="none" stroke="#3e7372" stroke-width="2.5"/><path d="M130 248V78M122 86l8-8 8 8M122 240l8 8 8-8" fill="none" stroke="#c87948" stroke-width="2.5"/><path d="M170 270H420M170 264v12M420 264v12" stroke="#c87948" stroke-width="2.5"/><g fill="#234352" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="17"><text x="112" y="168" text-anchor="end" fill="#b66d43" font-weight="700">高 h = 2</text><text x="295" y="297" text-anchor="middle" fill="#b66d43" font-weight="700">底边 a = 1</text><text x="320" y="154" text-anchor="middle" font-size="20" font-weight="700">正方形底面</text><text x="535" y="95">底面周长：4</text><text x="535" y="130">底面积：1</text><text x="535" y="165" fill="#167d80" font-weight="700">体积：1 × 2 = 2</text></g></svg>
