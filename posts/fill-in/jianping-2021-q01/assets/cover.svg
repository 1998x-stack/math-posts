<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="余弦函数完整覆盖负一到一"><title>cos x 的值域是 [−1,1]</title><desc>从零到二π，余弦曲线从一平滑下降到负一，再平滑回到一。</desc><rect width="720" height="300" rx="20" fill="#f4f9f7"/><path d="M80 150H650M110 260V35" stroke="#526b74" stroke-width="2"/><path d="M110 70H620M110 230H620" stroke="#d9825c" stroke-dasharray="7 5" stroke-width="2"/><path d="M110 70C175 70 210 230 365 230C520 230 555 70 620 70" fill="none" stroke="#167d80" stroke-width="5" stroke-linecap="round"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="16"><text x="125" y="55">1</text><text x="125" y="250">−1</text><text x="365" y="280" text-anchor="middle">π</text><text x="620" y="280" text-anchor="middle">2π</text><text x="430" y="42" font-weight="700">cos x 覆盖 [−1,1]</text></g></svg>