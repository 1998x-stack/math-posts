<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="q2t q2d"><title id="q2t">集合区间交集数轴图</title><desc id="q2d">A 是零到二的闭区间，B 是小于等于一的半直线，重合部分是零到一的闭区间。</desc><rect width="720" height="300" rx="20" fill="#f4f9f7"/><text x="36" y="38" font-size="20" font-weight="700" fill="#234352">同一条数轴上，只保留共同部分</text><path d="M100 250H640m-12 -8 12 8-12 8" stroke="#526b74" stroke-width="2.5" fill="none"/><g stroke="#526b74" stroke-width="2"><path d="M190 242v16M370 242v16M550 242v16"/></g><g fill="#234352" font-size="16"><text x="190" y="280" text-anchor="middle">0</text><text x="370" y="280" text-anchor="middle">1</text><text x="550" y="280" text-anchor="middle">2</text></g><text x="65" y="100" font-size="18" fill="#176c68" font-weight="700">A</text><path d="M190 106H550" stroke="#167d80" stroke-width="13" stroke-linecap="round"/><circle cx="190" cy="106" r="8" fill="#167d80" stroke="white" stroke-width="2"/><circle cx="550" cy="106" r="8" fill="#167d80" stroke="white" stroke-width="2"/><text x="575" y="112" font-size="17" fill="#176c68">[0,2]</text><text x="65" y="164" font-size="18" fill="#456f9c" font-weight="700">B</text><path d="M112 170H370" stroke="#7da4ce" stroke-width="13" stroke-linecap="round"/><path d="M112 170l-13 -8v16z" fill="#7da4ce"/><circle cx="370" cy="170" r="8" fill="#456f9c" stroke="white" stroke-width="2"/><text x="395" y="176" font-size="17" fill="#456f9c">(−∞,1]</text><text x="65" y="220" font-size="18" fill="#a56837" font-weight="700">交集</text><path d="M190 226H370" stroke="#d9825c" stroke-width="15" stroke-linecap="round"/><circle cx="190" cy="226" r="8" fill="#d9825c" stroke="white" stroke-width="2"/><circle cx="370" cy="226" r="8" fill="#d9825c" stroke="white" stroke-width="2"/><text x="395" y="232" font-size="18" fill="#a56837" font-weight="700">[0,1]</text></svg>
