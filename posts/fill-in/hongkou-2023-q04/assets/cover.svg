<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="q4-title q4-desc"><title id="q4-title">七个因式中选择四个倒数平方根项得到 x 的一次项</title><desc id="q4-desc">七个位置中三个选 x，四个选 x 的负二分之一次方。指数相加为三减二等于一，四个位置的选择数为组合数七选四。</desc><rect width="760" height="330" rx="22" fill="#f4f9f7"/><text x="380" y="42" text-anchor="middle" fill="#234352" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700">七个因式：每个位置都选 x 或 x^(-1/2)</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="16" text-anchor="middle"><rect x="58" y="75" width="76" height="64" rx="10" fill="#e5f1ee" stroke="#167d80" stroke-width="2"/><rect x="150" y="75" width="76" height="64" rx="10" fill="#e5f1ee" stroke="#167d80" stroke-width="2"/><rect x="242" y="75" width="76" height="64" rx="10" fill="#e5f1ee" stroke="#167d80" stroke-width="2"/><rect x="334" y="75" width="76" height="64" rx="10" fill="#f8e8dd" stroke="#d9825c" stroke-width="2"/><rect x="426" y="75" width="76" height="64" rx="10" fill="#f8e8dd" stroke="#d9825c" stroke-width="2"/><rect x="518" y="75" width="76" height="64" rx="10" fill="#f8e8dd" stroke="#d9825c" stroke-width="2"/><rect x="610" y="75" width="76" height="64" rx="10" fill="#f8e8dd" stroke="#d9825c" stroke-width="2"/><g fill="#167d80" font-weight="700"><text x="96" y="114">x</text><text x="188" y="114">x</text><text x="280" y="114">x</text></g><g fill="#b36b42" font-weight="700"><text x="372" y="114">x^(-1/2)</text><text x="464" y="114">x^(-1/2)</text><text x="556" y="114">x^(-1/2)</text><text x="648" y="114">x^(-1/2)</text></g><g fill="#526b74" font-size="13"><text x="96" y="160">1</text><text x="188" y="160">2</text><text x="280" y="160">3</text><text x="372" y="160">4</text><text x="464" y="160">5</text><text x="556" y="160">6</text><text x="648" y="160">7</text></g></g><path d="M96 185V207H280V185M372 185V207H648V185" fill="none" stroke="#9bb3b4" stroke-width="2"/><g fill="#234352" font-family="system-ui,'PingFang SC',sans-serif" font-size="17"><text x="188" y="238" text-anchor="middle" fill="#167d80">3 个 x：指数贡献 3</text><text x="510" y="238" text-anchor="middle" fill="#b36b42">4 个 x^(-1/2)：指数贡献 −2</text><text x="380" y="285" text-anchor="middle" font-size="21" font-weight="700">总指数：3 − 2 = 1，因此得到 x 项</text></g></svg>