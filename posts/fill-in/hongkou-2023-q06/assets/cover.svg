<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">公比为三分之一的等比数列及其极限</title><desc id="diagram-desc">左边依次为2、2/3、2/9、2/27的四根柱子；右边为逼近3的部分和折线，所有部分和均小于3。</desc><rect width="960" height="490" rx="24" fill="#f5faf7"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="48" y="54" font-size="26" font-weight="750" fill="#224752">每一项都是前一项的 1/3</text><text x="48" y="85" font-size="16" fill="#557078">单项越变越小，部分和却逐步靠近同一个上界</text><rect x="45" y="112" width="397" height="310" rx="18" fill="#fff" stroke="#dbe9e2"/><rect x="466" y="112" width="446" height="310" rx="18" fill="#fff" stroke="#dbe9e2"/><path d="M82 352H420M511 352H880" stroke="#7e9897" stroke-width="2"/><rect x="117" y="164" width="45" height="188" rx="5" fill="#167d80"/><rect x="196" y="289.3" width="45" height="62.7" rx="5" fill="#319b97"/><rect x="275" y="331.1" width="45" height="20.9" rx="4" fill="#77bcb0"/><rect x="354" y="345" width="45" height="7" rx="3" fill="#b2d9d0"/><g font-size="15" fill="#33545d" text-anchor="middle"><text x="140" y="371">b₁</text><text x="219" y="371">b₂</text><text x="298" y="371">b₃</text><text x="377" y="371">b₄</text><text x="140" y="152" font-weight="700">2</text><text x="219" y="280">2/3</text><text x="298" y="323">2/9</text><text x="377" y="333">2/27</text></g><path d="M522 140H865" stroke="#cf8258" stroke-width="2.5" stroke-dasharray="8 6"/><text x="860" y="127" text-anchor="end" font-size="15" fill="#ab5f35" font-weight="700">极限 S = 3</text><path d="M548 218L623 166L698 149L773 143L848 141" fill="none" stroke="#167d80" stroke-width="4"/><g fill="#167d80" stroke="#fff" stroke-width="3"><circle cx="548" cy="218" r="7"/><circle cx="623" cy="166" r="7"/><circle cx="698" cy="149" r="7"/><circle cx="773" cy="143" r="7"/><circle cx="848" cy="141" r="7"/></g><g font-size="15" fill="#33545d" text-anchor="middle"><text x="548" y="373">S₁</text><text x="623" y="373">S₂</text><text x="698" y="373">S₃</text><text x="773" y="373">S₄</text><text x="848" y="373">S₅</text></g><text x="548" y="242" font-size="14" text-anchor="middle" fill="#557078">2</text><text x="622" y="193" font-size="14" text-anchor="middle" fill="#557078">8/3</text><text x="487" y="396" font-size="15" fill="#557078">Sₙ = 3(1 − 3⁻ⁿ) &lt; 3</text></g></svg>