<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="q12e-t q12e-d"><title id="q12e-t">等差数列散点及指定三项的等比中项关系</title><desc id="q12e-d">数列第1到第6项依次为1、4、7、10、13、16。橙色的第1、2、6项为1、4、16，满足4平方等于1乘16。</desc><rect width="720" height="370" rx="22" fill="#f3f9f7"/><path d="M75 308H640M125 327V37" stroke="#4d6874" stroke-width="2.7"/><path d="M631 301l9 7-9 7M118 47l7-10 7 10" stroke="#4d6874" fill="none" stroke-width="2.7"/><g stroke="#d8eae4" stroke-width="1"><path d="M125 252H614M125 196H614M125 140H614M125 84H614"/></g><path d="M125 294L210 252L295 210L380 168L465 126L550 84" stroke="#0f887d" stroke-width="4.5" fill="none"/><g fill="#0f887d"><circle cx="295" cy="210" r="6"/><circle cx="380" cy="168" r="6"/><circle cx="465" cy="126" r="6"/></g><g fill="#d7844b" stroke="#fff" stroke-width="3"><circle cx="125" cy="294" r="9"/><circle cx="210" cy="252" r="9"/><circle cx="550" cy="84" r="9"/></g><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244454" font-size="18" text-anchor="middle"><text x="125" y="338">1</text><text x="210" y="338">2</text><text x="295" y="338">3</text><text x="380" y="338">4</text><text x="465" y="338">5</text><text x="550" y="338">6</text><text x="635" y="340">n</text><text x="100" y="296">1</text><text x="100" y="252">4</text><text x="95" y="87">16</text><text x="165" y="289" fill="#b16a39" font-weight="700">a₁=1</text><text x="241" y="242" fill="#b16a39" font-weight="700">a₂=4</text><text x="586" y="78" fill="#b16a39" font-weight="700">a₆=16</text><text x="425" y="51" font-size="24" font-weight="700">4² = 1 × 16</text><text x="375" y="366" font-size="15">公差 d=3；被选中的三项也满足等比条件</text></g></svg>
