<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="数轴上A=(2,4]，取a=4.5时B=[2.5,3.5)，蓝色B完全落入绿色A之内。"><title>集合A与函数值域B的包含关系</title><desc>数轴上A=(2,4]，取a=4.5时B=[2.5,3.5)，蓝色B完全落入绿色A之内。</desc><rect width="760" height="360" rx="20" fill="#f2f9f7"/><text x="68" y="67" font-size="24" fill="#2d5359" font-weight="700">A = (2,4]　；　B = [a−2,a−1)</text><text x="74" y="110" font-size="17" fill="#547073">示意取 a = 4.5 时，B = [2.5,3.5)</text><path d="M90 192H685M90 281H685" stroke="#778f91" stroke-width="2.3"/><path d="M200 192H600" stroke="#24a085" stroke-width="9"/><circle cx="200" cy="192" r="9" fill="#f2f9f7" stroke="#24a085" stroke-width="3"/><circle cx="600" cy="192" r="9" fill="#24a085"/><path d="M300 281H500" stroke="#d07b53" stroke-width="8"/><circle cx="300" cy="281" r="9" fill="#d07b53"/><circle cx="500" cy="281" r="9" fill="#f2f9f7" stroke="#d07b53" stroke-width="3"/><g font-family="system-ui,sans-serif" font-size="17" fill="#3e5963"><text x="112" y="182">A</text><text x="112" y="270">B</text><text x="185" y="225">2</text><text x="586" y="225">4</text><text x="281" y="317">2.5</text><text x="479" y="317">3.5</text><text x="60" y="347" font-size="19" fill="#197c75">左边界严格大于2，右边界不超过4 → 4&lt;a≤5</text></g></svg>