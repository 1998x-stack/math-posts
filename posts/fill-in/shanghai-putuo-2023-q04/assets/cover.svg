<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="q4-title q4-desc"><title id="q4-title">y 等于 tan 二 x 在给定区间内只有一个零点</title><desc id="q4-desc">横轴区间为负四分之派到正四分之派，边界处有正切渐近线。曲线单调上升并且只在原点穿过横轴，因此唯一零点为 x 等于零。</desc><rect width="720" height="340" rx="22" fill="#f3f8f7"/><path d="M90 180H640M360 300V34" stroke="#526b74" stroke-width="2.5"/><path d="M632 173l8 7-8 7M353 42l7-8 7 8" fill="none" stroke="#526b74" stroke-width="2"/><path d="M110 36V302M610 36V302" stroke="#c87948" stroke-width="2" stroke-dasharray="7 6"/><path d="M145.1,335.9 L154.1,303.1 L163.0,281.1 L172.0,265.3 L181.0,253.2 L189.9,243.8 L198.9,236.0 L207.8,229.6 L216.8,224.1 L225.7,219.3 L234.7,215.1 L243.6,211.4 L252.6,208.0 L261.5,204.9 L270.5,202.1 L279.4,199.4 L288.4,196.9 L297.3,194.5 L306.3,192.3 L315.2,190.1 L324.2,188.0 L333.1,186.0 L342.1,184.0 L351.0,182.0 L360.0,180.0 L369.0,178.0 L377.9,176.0 L386.9,174.0 L395.8,172.0 L404.8,169.9 L413.7,167.7 L422.7,165.5 L431.6,163.1 L440.6,160.6 L449.5,157.9 L458.5,155.1 L467.4,152.0 L476.4,148.6 L485.3,144.9 L494.3,140.7 L503.2,135.9 L512.2,130.4 L521.1,124.0 L530.1,116.2 L539.0,106.8 L548.0,94.7 L557.0,78.9 L565.9,56.9 L574.9,24.1" fill="none" stroke="#167d80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="180" r="8" fill="#d77f50" stroke="#fff" stroke-width="3"/><g fill="#234352" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="17"><text x="110" y="325" text-anchor="middle">−π/4</text><text x="360" y="325" text-anchor="middle">0</text><text x="610" y="325" text-anchor="middle">π/4</text><text x="650" y="170">x</text><text x="375" y="42">y</text><text x="390" y="160" fill="#b76a3e" font-weight="700">唯一零点 (0,0)</text><text x="130" y="54" fill="#b76a3e">左端不取</text><text x="520" y="54" fill="#b76a3e">右端不取</text></g></svg>
