<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="w10title w10desc"><title id="w10title">三位正整数至少两个数码为相同偶数的完整分类</title><desc id="w10desc">重复零是d00，共九个；固定非零偶数e有百十位ee星九种、百个位e星e九种、十个位星ee八种以及全部eee一种，共二十七。四个非零偶数共一百零八，加九得到一百一十七。</desc><rect width="900" height="470" rx="22" fill="#f2f9f6"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244753"><text x="35" y="46" font-size="25" font-weight="700">按被重复的偶数分类，不重也不漏</text><text x="35" y="77" font-size="17">百位不能为 0；三个全同只算一个整数</text></g><rect x="30" y="102" width="275" height="275" rx="15" fill="#fff" stroke="#d5e6df"/><rect x="328" y="102" width="540" height="275" rx="15" fill="#fff" stroke="#d5e6df"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244753"><text x="49" y="138" font-size="20" font-weight="700">① 两个 0</text><text x="352" y="138" font-size="20" font-weight="700">② 相同非零偶数 e</text><text x="49" y="281" font-size="17">d = 1,2,…,9</text><text x="49" y="316" font-size="17">只可能是 d00</text><text x="49" y="356" font-size="25" fill="#b77440" font-weight="800">共 9 个</text></g><g font-family="system-ui,sans-serif" font-size="25" font-weight="800" text-anchor="middle"><rect x="63" y="168" width="64" height="72" rx="9" fill="#e2eae9"/><rect x="135" y="168" width="64" height="72" rx="9" fill="#dff3e9"/><rect x="207" y="168" width="64" height="72" rx="9" fill="#dff3e9"/><text x="95" y="214" fill="#6a7e84">d</text><text x="167" y="214" fill="#118278">0</text><text x="239" y="214" fill="#118278">0</text></g><g font-family="system-ui,sans-serif" font-size="20" text-anchor="middle"><g fill="#f3f7f4"><rect x="356" y="165" width="425" height="40" rx="8"/><rect x="356" y="209" width="425" height="40" rx="8"/><rect x="356" y="253" width="425" height="40" rx="8"/></g><rect x="356" y="297" width="425" height="40" rx="8" fill="#e1f2e8"/><g fill="#108375" font-weight="700"><text x="411" y="192">e</text><text x="450" y="192">e</text><text x="411" y="236">e</text><text x="489" y="236">e</text><text x="450" y="280">e</text><text x="489" y="280">e</text><text x="411" y="324">e</text><text x="450" y="324">e</text><text x="489" y="324">e</text></g><g fill="#71858d"><text x="489" y="192">*</text><text x="450" y="236">*</text><text x="411" y="280">*</text></g><g fill="#244753"><text x="752" y="192">9</text><text x="752" y="236">9</text><text x="752" y="280">8</text><text x="752" y="324">1</text></g></g><g fill="#244753" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="17"><text x="557" y="192">百十位相同</text><text x="557" y="236">百个位相同</text><text x="557" y="280">十个位相同</text><text x="557" y="324">三位全相同</text><text x="352" y="362" fill="#0e796d">每个 e 有 27，e∈{2,4,6,8}</text></g><path d="M32 394H868" stroke="#c8e2d8" stroke-width="2"/><text x="451" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="29" font-weight="800" fill="#0c766d">9 + 4 × (9 + 9 + 8 + 1) = 117</text></svg>
