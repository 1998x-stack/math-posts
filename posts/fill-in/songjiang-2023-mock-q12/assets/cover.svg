 cx="472" cy="85.2" r="5.5" fill="#138b83"/><text x="472" y="292" text-anchor="middle" font-size="14" fill="#477078">7</text><line x1="529" y1="267" x2="529" y2="85.1" stroke="#abd9ce" stroke-width="2"/><circle cx="529" cy="85.1" r="5.5" fill="#138b83"/><text x="529" y="292" text-anchor="middle" font-size="14" fill="#477078">8</text><line x1="586" y1="267" x2="586" y2="85.0" stroke="#abd9ce" stroke-width="2"/><circle cx="586" cy="85.0" r="5.5" fill="#138b83"/><text x="586" y="292" text-anchor="middle" font-size="14" fill="#477078">9</text><line x1="643" y1="267" x2="643" y2="85.0" stroke="#abd9ce" stroke-width="2"/><circle cx="643" cy="85.0" r="5.5" fill="#138b83"/><text x="643" y="292" text-anchor="middle" font-size="14" fill="#477078">10</text><text x="56" y="320" font-size="18" fill="#315c65" font-family="system-ui,'Noto Sans SC',sans-serif">b₁ = −3；对 n≥2：1/(aₙ−1) = 1/aₙ₋₁ + 1/aₙ</text><text x="57" y="349" font-size="18" fill="#b2704c" font-family="system-ui,'Noto Sans SC',sans-serif">S₂₀₂₂ = −3 − 1/a₁ − 1/a₂₀₂₂ ∈ (−6,−5)</text></svg>