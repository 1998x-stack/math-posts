<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" role="img" aria-labelledby="q12title q12desc"><title id="q12title">正弦周期数列六个样本与首项最高条件</title><desc id="q12desc">在phi等于π除以六时，前六项依次是1、二分之一、负二分之一、负1、负二分之一、二分之一。第一项为全局最高。phi等于0或π除以三时，首项分别与第二项、第六项并列最大。</desc><rect width="900" height="465" rx="20" fill="#f3f9f6"/><rect x="22" y="20" width="855" height="345" rx="15" fill="#fff" stroke="#d4e6de"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#254654"><text x="44" y="58" font-size="23" font-weight="700">φ = π/6 的六项周期：第一项是峰值</text><text x="44" y="86" font-size="16">每隔60°取一个正弦样本，六项后重复</text></g><path d="M65 229H829" stroke="#7c979b" stroke-width="2"/><g stroke="#dceae4" stroke-width="1.5"><path d="M65 120H829M65 338H829"/></g><g stroke-width="15" stroke-linecap="round"><path d="M143 229V120" stroke="#d38a50"/><path d="M258 229V174.5" stroke="#158879"/><path d="M373 229V283.5" stroke="#158879"/><path d="M488 229V338" stroke="#158879"/><path d="M603 229V283.5" stroke="#158879"/><path d="M718 229V174.5" stroke="#158879"/></g><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244753" font-size="18" text-anchor="middle"><text x="143" y="103" fill="#b36d37" font-weight="700">1（最大）</text><text x="258" y="159">1/2</text><text x="373" y="307">−1/2</text><text x="488" y="360">−1</text><text x="603" y="307">−1/2</text><text x="718" y="159">1/2</text><text x="143" y="256">a₁</text><text x="258" y="256">a₂</text><text x="373" y="256">a₃</text><text x="488" y="256">a₄</text><text x="603" y="256">a₅</text><text x="718" y="256">a₆</text></g><g font-family="system-ui,'Noto Sans SC',sans-serif" font-size="18" fill="#244753"><text x="38" y="401">φ = 0：a₁ 与 a₂ 并列最大</text><text x="38" y="433">φ = π/3：a₁ 与 a₆ 并列最大</text><text x="571" y="417" font-size="26" font-weight="800" fill="#10796d">φ ∈ [0, π/3]</text></g></svg>
