<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="数轴上 A 为 −2 到 1 的左开右闭区间，整数交集仅包含 −1、0、1。"><title>整数轴与左开右闭区间的交集</title><desc>数轴上 A 为 −2 到 1 的左开右闭区间，整数交集仅包含 −1、0、1。</desc><rect width="760" height="360" rx="24" fill="#f3faf7"/><path d="M65 206H705M693 199l12 7-12 7" stroke="#657d7d" stroke-width="2.4" fill="none"/><rect x="230" y="170" width="280" height="70" rx="14" fill="#d6efe5" opacity=".85"/><path d="M230 206H510" stroke="#14857d" stroke-width="9"/><circle cx="230" cy="206" r="8" fill="#f3faf7" stroke="#14857d" stroke-width="3"/><circle cx="510" cy="206" r="9" fill="#14857d"/><g font-family="system-ui,sans-serif" fill="#334f55" font-size="17" text-anchor="middle"><path d="M137 195v22" stroke="#647d7d" stroke-width="1.6"/><text x="137" y="248">-3</text><path d="M230 195v22" stroke="#647d7d" stroke-width="1.6"/><text x="230" y="248">-2</text><path d="M323 195v22" stroke="#647d7d" stroke-width="1.6"/><text x="323" y="248">-1</text><path d="M416 195v22" stroke="#647d7d" stroke-width="1.6"/><text x="416" y="248">0</text><path d="M509 195v22" stroke="#647d7d" stroke-width="1.6"/><text x="509" y="248">1</text><path d="M602 195v22" stroke="#647d7d" stroke-width="1.6"/><text x="602" y="248">2</text></g><circle cx="323" cy="206" r="9" fill="#df8050" stroke="#fff" stroke-width="2"/><circle cx="416" cy="206" r="9" fill="#df8050" stroke="#fff" stroke-width="2"/><circle cx="509" cy="206" r="9" fill="#df8050" stroke="#fff" stroke-width="2"/><text x="72" y="74" font-size="25" font-weight="700" fill="#1e4549">A = (−2, 1]　∩　ℤ</text><text x="75" y="113" font-size="18" fill="#52686c">空心：−2 不取；实心：1 可以取</text><text x="236" y="306" font-size="20" fill="#13766e">交集 {−1, 0, 1}</text></svg>