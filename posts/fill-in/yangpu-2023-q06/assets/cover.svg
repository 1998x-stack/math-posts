<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="q6t q6d"><title id="q6t">向量投影：为什么 (3,4) 投到横轴后是 (3,0)</title><desc id="q6d">向量 a 从原点到点三逗号四，沿水平向量 b 正交投影到三逗号零。</desc><rect width="760" height="360" rx="20" fill="#f4f9f7"/><defs><marker id="q6arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#167d80"/></marker><marker id="q6arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#d9825c"/></marker></defs>
<text x="32" y="40" font-size="22" font-weight="700" fill="#234352">投影 = 保留水平方向，舍去垂直分量</text>
<path d="M110 300V65M75 279H695" fill="none" stroke="#738b96" stroke-width="2"/><text x="700" y="286" font-size="16" fill="#375360">x</text><text x="99" y="57" font-size="16" fill="#375360">y</text>
<g stroke="#e1ecea" stroke-width="1"><path d="M180 74V318"/><path d="M250 74V318"/><path d="M320 74V318"/><path d="M390 74V318"/><path d="M460 74V318"/><path d="M75 233H695"/><path d="M75 187H695"/><path d="M75 141H695"/><path d="M75 95H695"/></g>
<path d="M110 279L320 95" stroke="#167d80" stroke-width="5" marker-end="url(#q6arr)"/><path d="M110 279L320 279" stroke="#d9825c" stroke-width="5" marker-end="url(#q6arr2)"/><path d="M320 95V279" stroke="#d9825c" stroke-width="2.8" stroke-dasharray="8 6"/><path d="M304 279V263H320" fill="none" stroke="#c98361" stroke-width="2"/>
<circle cx="110" cy="279" r="5" fill="#375360"/><circle cx="320" cy="95" r="6" fill="#167d80"/><circle cx="320" cy="279" r="6" fill="#d9825c"/>
<g fill="#234352" font-size="18"><text x="82" y="305">O</text><text x="334" y="90">A(3,4)</text><text x="334" y="284">H(3,0)</text><text x="199" y="162" fill="#167d80">a=(3,4)</text><text x="174" y="270" fill="#a96945">投影=(3,0)</text><text x="455" y="100">a = OH + HA</text><text x="455" y="139">=(3,0)+(0,4)</text><text x="455" y="193" font-size="16">b=(1,0) 沿 x 轴</text></g></svg>