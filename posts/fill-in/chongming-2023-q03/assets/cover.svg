<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title-q3 desc-q3"><title id="title-q3">纯虚数与复平面的虚轴</title><desc id="desc-q3">乘积的坐标是六减 a 和二加三 a；a 等于六时位于虚轴二十 i 处，横坐标为零但不是原点。</desc><rect width="720" height="320" rx="22" fill="#f4f9f7"/><path d="M75 267H472M140 287V37" stroke="#526d77" stroke-width="2"/><path d="M466 261l6 6l-6 6M134 43l6 -6l6 6" stroke="#526d77" fill="none" stroke-width="2"/><text x="477" y="274" fill="#385963" font-size="16" font-family="system-ui,sans-serif">Re</text><text x="116" y="31" fill="#385963" font-size="16" font-family="system-ui,sans-serif">Im</text><path d="M98 59L392 250" fill="none" stroke="#9dbab6" stroke-width="4"/><circle cx="392" cy="250" r="8" fill="#84a1a1"/><circle cx="140" cy="87" r="10" fill="#dd805d" stroke="#fff" stroke-width="3"/><text x="159" y="80" fill="#b15c3d" font-size="18" font-weight="700" font-family="system-ui,sans-serif">a=6 → 20i</text><text x="361" y="237" fill="#526e79" font-size="15" font-family="system-ui,sans-serif">a=0</text><rect x="494" y="79" width="192" height="171" rx="14" fill="#fff" stroke="#d4e5df"/><text x="511" y="114" fill="#28525a" font-size="18" font-weight="700" font-family="system-ui,sans-serif">乘积坐标</text><text x="511" y="154" fill="#486671" font-size="17" font-family="system-ui,sans-serif">实部：6 − a</text><text x="511" y="189" fill="#486671" font-size="17" font-family="system-ui,sans-serif">虚部：2 + 3a</text><text x="511" y="226" fill="#ac5c3b" font-size="14" font-family="system-ui,sans-serif">a=6：横坐标为 0</text><text x="358" y="301" text-anchor="middle" fill="#486773" font-size="15" font-family="system-ui,sans-serif">实部为零、虚部非零，才是纯虚数</text></svg>
