<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="q3t q3d"><title id="q3t">对数方程定义域交集</title><desc id="q3d">左侧真数为正时 x 小于负一或大于五，右侧真数为正时 x 大于负一，两者交集为 x 大于五，候选根中只有六有效。</desc><rect width="720" height="310" rx="20" fill="#f4f9f7"/><text x="36" y="38" font-size="20" font-weight="700" fill="#234352">先取定义域，再筛选候选根</text><path d="M100 265H650m-12 -8 12 8-12 8" stroke="#526b74" stroke-width="2.5" fill="none"/><g stroke="#526b74" stroke-width="2"><path d="M190 257v16M270 257v16M585 257v16"/></g><g fill="#234352" font-size="15"><text x="190" y="290" text-anchor="middle">−1</text><text x="270" y="290" text-anchor="middle">0</text><text x="585" y="290" text-anchor="middle">5</text></g><text x="40" y="98" font-size="16" fill="#456f9c" font-weight="700">真数1 &gt; 0</text><path d="M110 108H190M585 108H635" stroke="#7da4ce" stroke-width="12" stroke-linecap="round"/><path d="M110 108l-10 -7v14zM635 108l10 -7v14z" fill="#7da4ce"/><circle cx="190" cy="108" r="7" fill="#f4f9f7" stroke="#456f9c" stroke-width="3"/><circle cx="585" cy="108" r="7" fill="#f4f9f7" stroke="#456f9c" stroke-width="3"/><text x="360" y="100" font-size="15" fill="#456f9c">x &lt; −1 或 x &gt; 5</text><text x="40" y="164" font-size="16" fill="#176c68" font-weight="700">真数2 &gt; 0</text><path d="M190 174H635" stroke="#167d80" stroke-width="12" stroke-linecap="round"/><path d="M635 174l10 -7v14z" fill="#167d80"/><circle cx="190" cy="174" r="7" fill="#f4f9f7" stroke="#167d80" stroke-width="3"/><text x="390" y="166" font-size="15" fill="#176c68">x &gt; −1</text><text x="40" y="230" font-size="16" fill="#a56837" font-weight="700">交集</text><path d="M585 240H635" stroke="#d9825c" stroke-width="14" stroke-linecap="round"/><path d="M635 240l10 -7v14z" fill="#d9825c"/><circle cx="585" cy="240" r="7" fill="#f4f9f7" stroke="#d9825c" stroke-width="3"/><text x="355" y="232" font-size="16" fill="#a56837" font-weight="700">x &gt; 5；−1 被排除，6 保留</text></svg>
