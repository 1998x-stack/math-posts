<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="四个二选一元素对应十六个子集"><title>二选一展开枚举子集</title><desc>四个二选一因子产生十六个二进制组合，0000为空集，另外十五个是非空子集。</desc><rect width="720" height="300" rx="20" fill="#f4f9f7"/><text x="40" y="35" fill="#234352" font-size="17" font-family="system-ui,sans-serif" font-weight="700">4 个元素 × 每个 2 种选择</text><g fill="#fff" stroke="#c8ddd6" stroke-width="1.5"><rect x="55" y="60" width="140" height="44" rx="8"/><rect x="220" y="60" width="140" height="44" rx="8"/><rect x="385" y="60" width="140" height="44" rx="8"/><rect x="550" y="60" width="115" height="44" rx="8"/><rect x="55" y="120" width="140" height="44" rx="8"/><rect x="220" y="120" width="140" height="44" rx="8"/><rect x="385" y="120" width="140" height="44" rx="8"/><rect x="550" y="120" width="115" height="44" rx="8"/><rect x="55" y="180" width="140" height="44" rx="8"/><rect x="220" y="180" width="140" height="44" rx="8"/><rect x="385" y="180" width="140" height="44" rx="8"/><rect x="550" y="180" width="115" height="44" rx="8"/><rect x="55" y="240" width="140" height="44" rx="8"/><rect x="220" y="240" width="140" height="44" rx="8"/><rect x="385" y="240" width="140" height="44" rx="8"/><rect x="550" y="240" width="115" height="44" rx="8"/></g><g fill="#234352" font-family="ui-monospace,monospace" font-size="16" text-anchor="middle"><text x="125" y="88">0000 ∅</text><text x="290" y="88">0001</text><text x="455" y="88">0010</text><text x="607" y="88">0011</text><text x="125" y="148">0100</text><text x="290" y="148">0101</text><text x="455" y="148">0110</text><text x="607" y="148">0111</text><text x="125" y="208">1000</text><text x="290" y="208">1001</text><text x="455" y="208">1010</text><text x="607" y="208">1011</text><text x="125" y="268">1100</text><text x="290" y="268">1101</text><text x="455" y="268">1110</text><text x="607" y="268">1111</text></g><rect x="55" y="60" width="140" height="44" rx="8" fill="#ffe7d3" stroke="#d9825c" stroke-width="2"/><text x="125" y="88" fill="#a45e3c" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" font-weight="700">0000 = 空集</text></svg>