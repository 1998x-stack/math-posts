<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="q2-title q2-desc"><title id="q2-title">函数 x 加四除以 x 在 x 等于二时取得最小值四</title><desc id="q2-desc">正半轴上的曲线从较大数值下降到点二四，再上升。水平虚线 y 等于四与曲线在二四处相切。</desc><rect width="760" height="330" rx="22" fill="#f4f9f7"/><path d="M80 270H680M110 42V278" stroke="#526b74" stroke-width="2"/><path d="M672 263l8 7-8 7M104 50l6-8 6 8" fill="none" stroke="#526b74" stroke-width="2"/><path d="M110 260H650" stroke="#d9825c" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M110 116C145 194 180 235 220 255S275 260 330 257S430 238 495 228S565 207 630 201" fill="none" stroke="#167d80" stroke-width="5" stroke-linecap="round"/><path d="M275 260V285" stroke="#167d80" stroke-width="2" stroke-dasharray="4 4"/><circle cx="275" cy="260" r="7" fill="#167d80" stroke="#fff" stroke-width="2"/><g fill="#234352" font-family="system-ui,'PingFang SC',sans-serif" font-size="16"><text x="72" y="264" text-anchor="end">4</text><text x="275" y="308" text-anchor="middle">x=2</text><text x="645" y="248" text-anchor="end">y=4</text><text x="515" y="62" font-size="19" font-weight="700">y=x+4/x（x&gt;0）</text><text x="292" y="238" fill="#167d80" font-weight="700">最低点 (2,4)</text><text x="28" y="315" font-size="13">曲线只表示正数 x 的范围</text></g></svg>