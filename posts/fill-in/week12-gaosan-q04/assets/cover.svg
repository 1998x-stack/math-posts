<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="q12d-t q12d-d"><title id="q12d-t">k 从零到六时二项式指数按三递减</title><desc id="q12d-d">七个 k 的取值对应指数六三零负三负六负九负十二。仅 k 等于二时指数归零，对应常数项六十。</desc><rect width="720" height="345" rx="22" fill="#f3f9f7"/><text x="55" y="48" fill="#244454" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="24" font-weight="700">选取次数 k → 指数 6−3k</text><rect x="250" y="80" width="72" height="161" rx="12" fill="#d9f1e9"/><path d="M76 146H661M76 218H661" stroke="#c7dcd6" stroke-width="2"/><g font-family="system-ui,sans-serif" fill="#244454" font-size="21" text-anchor="middle"><text x="110" y="131">0</text><text x="198" y="131">1</text><text x="286" y="131" fill="#0e7b72" font-weight="800">2</text><text x="374" y="131">3</text><text x="462" y="131">4</text><text x="550" y="131">5</text><text x="638" y="131">6</text><text x="110" y="200">6</text><text x="198" y="200">3</text><text x="286" y="200" fill="#0e7b72" font-weight="800">0</text><text x="374" y="200">−3</text><text x="462" y="200">−6</text><text x="550" y="200">−9</text><text x="638" y="200">−12</text></g><g font-family="system-ui,'Noto Sans SC',sans-serif" font-size="16" fill="#345e64"><text x="22" y="129">k</text><text x="15" y="197">指数</text></g><path d="M286 243V260" stroke="#cf7b44" stroke-width="3"/><text x="354" y="283" text-anchor="middle" font-size="23" font-family="system-ui,sans-serif" fill="#b36835" font-weight="700">k = 2 ⇒ C₆² × 2² = 60</text><text x="350" y="323" text-anchor="middle" font-size="17" font-family="system-ui,'Noto Sans SC',sans-serif" fill="#345e64">指数恰好为零，变量 x 完全抵消</text></svg>
