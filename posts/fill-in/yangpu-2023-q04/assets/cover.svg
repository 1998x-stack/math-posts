<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="q4t q4d"><title id="q4t">单位圆上正弦值为二分之一的两个角</title><desc id="q4d">水平线 y 等于二分之一与单位圆上半圆交于第一和第二象限两点，对应圆周率六分之一和五倍圆周率六分之一。</desc><rect width="720" height="320" rx="20" fill="#f4f9f7"/><text x="36" y="38" font-size="20" font-weight="700" fill="#234352">单位圆：同一个正弦值，对应两个角</text><path d="M105 180H625M360 292V55" stroke="#526b74" stroke-width="2"/><circle cx="360" cy="180" r="108" fill="none" stroke="#9eb8d4" stroke-width="3"/><path d="M360 180L453.5 126M360 180L266.5 126" stroke="#167d80" stroke-width="3"/><path d="M266.5 126H453.5" stroke="#d9825c" stroke-width="3" stroke-dasharray="7 5"/><circle cx="453.5" cy="126" r="7" fill="#167d80"/><circle cx="266.5" cy="126" r="7" fill="#167d80"/><path d="M405 180A45 45 0 0 0 399 157M315 180A45 45 0 0 1 321 157" fill="none" stroke="#d9825c" stroke-width="3"/><g fill="#234352" font-size="16"><text x="466" y="116">α = π/6</text><text x="130" y="116">α = 5π/6</text><text x="365" y="118" fill="#a56837">y = 1/2</text><text x="632" y="185">x</text><text x="372" y="58">y</text><text x="372" y="200">O</text></g></svg>
