<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="|x−2|+|x−3| 是两处固定点距离之和，在 x∈[2,3]时恒等于1，其余位置大于1。"><title>绝对值距离和的最小值平台</title><desc>|x−2|+|x−3| 是两处固定点距离之和，在 x∈[2,3]时恒等于1，其余位置大于1。</desc><rect width="760" height="360" rx="20" fill="#f2f9f7"/><path d="M80 251H699M100 44V300" stroke="#7b9495" stroke-width="2"/><path d="M110 41L330 200H440L660 41" fill="none" stroke="#1a8b86" stroke-width="4" stroke-linejoin="round"/><path d="M110 200H679" stroke="#c67f4c" stroke-dasharray="7 5" stroke-width="2.4"/><rect x="330" y="188" width="110" height="24" rx="8" fill="#d7eade" opacity=".8"/><path d="M330 200H440" stroke="#159a86" stroke-width="7"/><g font-family="system-ui,sans-serif" font-size="17" fill="#3d565d"><text x="92" y="274">0</text><text x="320" y="275">2</text><text x="431" y="275">3</text><text x="650" y="275">5</text><text x="130" y="189">y=1</text><text x="462" y="187">最小值平台[2,3]</text><text x="63" y="57" font-size="21" fill="#28515c">两距离之和</text><text x="132" y="324" font-size="20" fill="#177e76">因此 2a²+a ≤ 1 才能对一切 x 成立</text></g></svg>