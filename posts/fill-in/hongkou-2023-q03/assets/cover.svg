<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="q3-title q3-desc"><title id="q3-title">半径为三的球及其中心到球面的半径</title><desc id="q3-desc">球的轮廓以圆形表示，水平椭圆表示赤道截面。线段从球心 O 指向球面点 A，标记长度 r 等于三。</desc><rect width="760" height="340" rx="22" fill="#f4f9f7"/><circle cx="340" cy="165" r="116" fill="#dcefeb" stroke="#167d80" stroke-width="3"/><path d="M224 165C270 118 410 118 456 165C410 212 270 212 224 165Z" fill="none" stroke="#77aaa4" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M340 165L456 165" stroke="#d9825c" stroke-width="4" stroke-linecap="round"/><circle cx="340" cy="165" r="5" fill="#234352"/><circle cx="456" cy="165" r="7" fill="#d9825c"/><path d="M340 165L340 49" stroke="#9bb3b4" stroke-width="1.5" stroke-dasharray="4 5"/><g fill="#234352" font-family="system-ui,'PingFang SC',sans-serif" font-size="18"><text x="325" y="190" text-anchor="end">O</text><text x="472" y="170">A</text><text x="397" y="148" fill="#b36b42" font-weight="700">r = 3</text><text x="520" y="104" font-size="21" font-weight="700">球的体积</text><text x="520" y="140">由半径的三次方决定</text><text x="520" y="180">不是表面积（平方单位）</text><text x="28" y="315" font-size="13">赤道椭圆表示球的水平截面</text></g></svg>