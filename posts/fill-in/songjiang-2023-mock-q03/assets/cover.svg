<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="实部为横坐标虚部为纵坐标，z=2+i指向点(2,1)，平方 z²=3+4i 指向点(3,4)。"><title>复数平方在复平面上的向量图</title><desc>实部为横坐标虚部为纵坐标，z=2+i指向点(2,1)，平方 z²=3+4i 指向点(3,4)。</desc><rect width="760" height="360" rx="24" fill="#f3faf7"/><path d="M90 292H700M244 320V40" stroke="#70898c" stroke-width="2"/><text x="700" y="281" font-size="17" fill="#49646a">Re</text><text x="258" y="49" font-size="17" fill="#49646a">Im</text><path d="M244 292L366 231" stroke="#18867a" stroke-width="4"/><path d="M244 292L427 48" stroke="#cf7a50" stroke-width="4"/><path d="M366 231V292M427 48V292" stroke="#8ca6a2" stroke-dasharray="5 6" stroke-width="2"/><path d="M244 292H427M244 292H366" stroke="#8ca6a2" stroke-dasharray="5 6" stroke-width="1.2"/><circle cx="366" cy="231" r="7" fill="#18867a" stroke="#ffffff" stroke-width="2"/><text x="376" y="219" font-size="16" fill="#304653" font-family="system-ui,sans-serif">z = 2 + i</text><circle cx="427" cy="48" r="7" fill="#cf7a50" stroke="#ffffff" stroke-width="2"/><text x="437" y="73" font-size="16" fill="#304653" font-family="system-ui,sans-serif">z² = 3 + 4i</text><text x="70" y="76" font-size="23" font-weight="700" fill="#274957">先比较共轭，再平方</text><text x="80" y="347" font-size="16" fill="#486a70">绿色：z；橙色：z²（非仅把坐标分别平方）</text></svg>