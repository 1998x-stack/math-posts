<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">十五种两罐组合中九种可以中奖</title><desc id="svg-desc">绿色格九个为至少抽到一罐有奖，灰色格六个是两罐都无奖。</desc><rect width="720" height="320" rx="22" fill="#f4f9f7"/><g font-family="system-ui,sans-serif"><text x="360" y="38" text-anchor="middle" font-size="23" fill="#244954">全部 15 种抽法</text><rect x="50" y="70" width="120" height="58" rx="9" fill="#cee9df"/><text x="110" y="105" text-anchor="middle" font-size="17" fill="#315764">奖1+奖2</text><rect x="183" y="70" width="120" height="58" rx="9" fill="#cee9df"/><text x="243" y="105" text-anchor="middle" font-size="17" fill="#315764">奖1+无1</text><rect x="316" y="70" width="120" height="58" rx="9" fill="#cee9df"/><text x="376" y="105" text-anchor="middle" font-size="17" fill="#315764">奖1+无2</text><rect x="449" y="70" width="120" height="58" rx="9" fill="#cee9df"/><text x="509" y="105" text-anchor="middle" font-size="17" fill="#315764">奖1+无3</text><rect x="582" y="70" width="120" height="58" rx="9" fill="#cee9df"/><text x="642" y="105" text-anchor="middle" font-size="17" fill="#315764">奖1+无4</text><rect x="50" y="142" width="120" height="58" rx="9" fill="#cee9df"/><text x="110" y="177" text-anchor="middle" font-size="17" fill="#315764">奖2+无1</text><rect x="183" y="142" width="120" height="58" rx="9" fill="#cee9df"/><text x="243" y="177" text-anchor="middle" font-size="17" fill="#315764">奖2+无2</text><rect x="316" y="142" width="120" height="58" rx="9" fill="#cee9df"/><text x="376" y="177" text-anchor="middle" font-size="17" fill="#315764">奖2+无3</text><rect x="449" y="142" width="120" height="58" rx="9" fill="#cee9df"/><text x="509" y="177" text-anchor="middle" font-size="17" fill="#315764">奖2+无4</text><rect x="582" y="142" width="120" height="58" rx="9" fill="#e9dfd3"/><text x="642" y="177" text-anchor="middle" font-size="17" fill="#315764">无1+无2</text><rect x="50" y="214" width="120" height="58" rx="9" fill="#e9dfd3"/><text x="110" y="249" text-anchor="middle" font-size="17" fill="#315764">无1+无3</text><rect x="183" y="214" width="120" height="58" rx="9" fill="#e9dfd3"/><text x="243" y="249" text-anchor="middle" font-size="17" fill="#315764">无1+无4</text><rect x="316" y="214" width="120" height="58" rx="9" fill="#e9dfd3"/><text x="376" y="249" text-anchor="middle" font-size="17" fill="#315764">无2+无3</text><rect x="449" y="214" width="120" height="58" rx="9" fill="#e9dfd3"/><text x="509" y="249" text-anchor="middle" font-size="17" fill="#315764">无2+无4</text><rect x="582" y="214" width="120" height="58" rx="9" fill="#e9dfd3"/><text x="642" y="249" text-anchor="middle" font-size="17" fill="#315764">无3+无4</text><text x="220" y="307" font-size="17" fill="#167d80">绿色：中奖 9</text><text x="430" y="307" font-size="17" fill="#806a58">灰色：不中奖 6</text></g></svg>
