<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="w8t w8d"><title id="w8t">两个根的和与积决定换底对数和</title><desc id="w8d">数轴上α等于三减根号五约0.764，β等于三加根号五约5.236；二者和为6积为4，换底公式使对数和等于7。</desc><rect width="860" height="390" rx="22" fill="#f2f9f6"/><text x="45" y="55" font-family="system-ui,'Noto Sans SC',sans-serif" font-size="23" font-weight="700" fill="#244653">把两个对数换成两个根的比值</text><path d="M95 137H752" stroke="#476575" stroke-width="3"/><path d="M743 130l9 7-9 7" stroke="#476575" stroke-width="2" fill="none"/><g font-family="system-ui,sans-serif" font-size="18" fill="#34535b"><text x="94" y="167">0</text><text x="744" y="167">x</text></g><circle cx="181" cy="137" r="10" fill="#d28749" stroke="white" stroke-width="3"/><circle cx="669" cy="137" r="10" fill="#168979" stroke="white" stroke-width="3"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244653" font-size="18"><text x="122" y="108" fill="#b87037">α ≈ 0.764</text><text x="632" y="108" fill="#0b796f">β ≈ 5.236</text><text x="345" y="107">根和 = 6</text></g><rect x="45" y="205" width="231" height="108" rx="13" fill="#fff" stroke="#d8e8e3"/><rect x="313" y="205" width="230" height="108" rx="13" fill="#fff" stroke="#d8e8e3"/><rect x="580" y="205" width="230" height="108" rx="13" fill="#dcefe9" stroke="#a4cbbb"/><g font-family="system-ui,'Noto Sans SC',sans-serif" text-anchor="middle" fill="#244653"><text x="160" y="249" font-size="23" font-weight="700">α + β = 6</text><text x="160" y="280" font-size="16">一次项确定根和</text><text x="428" y="249" font-size="23" font-weight="700">α × β = 4</text><text x="428" y="280" font-size="16">常数项确定根积</text><text x="695" y="249" font-size="23" font-weight="700" fill="#0d776d">商的和 = 7</text><text x="695" y="280" font-size="16">平方和除以根积</text></g><g stroke="#b77a45" stroke-width="3" fill="none"><path d="M280 258H306M547 258H574"/><path d="M297 251l9 7-9 7M565 251l9 7-9 7"/></g><text x="47" y="353" font-family="system-ui,sans-serif" font-size="18" fill="#426b6c">logₐb = β/α，logᵦa = α/β</text></svg>
