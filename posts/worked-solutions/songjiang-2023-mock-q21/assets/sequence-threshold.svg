<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-labelledby="threshold-title threshold-desc">
<title id="threshold-title">删除每三个原序号后按奇偶分组，并观察集合 H 的上下确界</title>
<desc id="threshold-desc">上半部分显示原序号3、6、9、12被删除，保留序号映射为1、2、4、5、7、8、10、11。下半部分显示奇数 n 对应的离散值从1/e递增趋近A，偶数 n 对应的离散值从(1+e)/e递增趋近C但不取到；H的最小值为1/e，上确界为C，二者距离为C减1/e。</desc>
<rect x="12" y="12" width="976" height="586" rx="24" fill="#f5faf8" stroke="#d5e5e0"/>
<text x="48" y="55" font-size="24" font-weight="700" fill="#244b50" font-family="system-ui,'Noto Sans SC',sans-serif">① 每三个原项删去一个：原序号 → 新序号</text>
<text x="60" y="100" font-size="17" fill="#47656a" font-family="system-ui,'Noto Sans SC',sans-serif">原序号 j</text>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="16" font-weight="700">
<circle cx="154" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="154" y="110" fill="#245e55">1</text><circle cx="220" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="220" y="110" fill="#245e55">2</text>
<circle cx="286" cy="104" r="19" fill="#fae5e0" stroke="#c56b55" stroke-width="2"/><text x="286" y="110" fill="#a64e3f">3</text><path d="M274 92L298 116M298 92L274 116" stroke="#b84e42" stroke-width="3"/>
<circle cx="352" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="352" y="110" fill="#245e55">4</text><circle cx="418" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="418" y="110" fill="#245e55">5</text>
<circle cx="484" cy="104" r="19" fill="#fae5e0" stroke="#c56b55" stroke-width="2"/><text x="484" y="110" fill="#a64e3f">6</text><path d="M472 92L496 116M496 92L472 116" stroke="#b84e42" stroke-width="3"/>
<circle cx="550" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="550" y="110" fill="#245e55">7</text><circle cx="616" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="616" y="110" fill="#245e55">8</text>
<circle cx="682" cy="104" r="19" fill="#fae5e0" stroke="#c56b55" stroke-width="2"/><text x="682" y="110" fill="#a64e3f">9</text><path d="M670 92L694 116M694 92L670 116" stroke="#b84e42" stroke-width="3"/>
<circle cx="748" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="748" y="110" fill="#245e55">10</text><circle cx="814" cy="104" r="19" fill="#d9eee8" stroke="#3f8d7c" stroke-width="2"/><text x="814" y="110" fill="#245e55">11</text>
<circle cx="880" cy="104" r="19" fill="#fae5e0" stroke="#c56b55" stroke-width="2"/><text x="880" y="110" fill="#a64e3f">12</text><path d="M868 92L892 116M892 92L868 116" stroke="#b84e42" stroke-width="3"/>
</g>
<text x="60" y="157" font-size="16" fill="#a34f43" font-family="system-ui,'Noto Sans SC',sans-serif">红色叉号：删除 3、6、9、12……</text><text x="60" y="195" font-size="17" fill="#47656a" font-family="system-ui,'Noto Sans SC',sans-serif">新序号 n ← 原序号 j</text>
<g font-family="system-ui,'Noto Sans SC',sans-serif" font-size="16" text-anchor="middle"><g fill="#e5edf9" stroke="#7189b7"><rect x="112" y="176" width="72" height="38" rx="12"/><rect x="204" y="176" width="72" height="38" rx="12"/><rect x="296" y="176" width="72" height="38" rx="12"/><rect x="388" y="176" width="72" height="38" rx="12"/><rect x="480" y="176" width="72" height="38" rx="12"/><rect x="572" y="176" width="72" height="38" rx="12"/><rect x="664" y="176" width="72" height="38" rx="12"/><rect x="756" y="176" width="72" height="38" rx="12"/></g><g fill="#354e7b"><text x="148" y="201">1 ← 1</text><text x="240" y="201">2 ← 2</text><text x="332" y="201">3 ← 4</text><text x="424" y="201">4 ← 5</text><text x="516" y="201">5 ← 7</text><text x="608" y="201">6 ← 8</text><text x="700" y="201">7 ← 10</text><text x="792" y="201">8 ← 11</text></g></g>
<path d="M48 238H952" stroke="#d5e5e0" stroke-width="2"/><text x="48" y="278" font-size="24" font-weight="700" fill="#244b50" font-family="system-ui,'Noto Sans SC',sans-serif">② 两支离散数列：下端点取到，上端点只趋近</text>
<text x="58" y="322" font-size="17" fill="#356f9c" font-family="system-ui,'Noto Sans SC',sans-serif">奇数 n：从 1/e 出发，递增趋近 A（不取到）</text><text x="58" y="358" font-size="17" fill="#b36b2f" font-family="system-ui,'Noto Sans SC',sans-serif">偶数 n：从 (1+e)/e 出发，递增趋近 C（不取到）</text>
<path d="M150 405H930" stroke="#60777b" stroke-width="2.4"/><path d="M150 398V412M930 398V412" stroke="#60777b" stroke-width="2.4"/>
<g fill="#356f9c" stroke="#fff" stroke-width="1.4"><circle cx="315.5" cy="405" r="7"/><circle cx="346.2" cy="405" r="6"/></g><path d="M346.2 405L347.8 405" stroke="#356f9c" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="347.8" cy="405" r="8" fill="#f5faf8" stroke="#356f9c" stroke-width="2.5"/>
<g fill="#b36b2f" stroke="#fff" stroke-width="1.4"><circle cx="765.5" cy="405" r="7"/><circle cx="796.2" cy="405" r="6"/></g><path d="M796.2 405L797.8 405" stroke="#b36b2f" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="797.8" cy="405" r="8" fill="#f5faf8" stroke="#b36b2f" stroke-width="2.5"/>
<g font-size="16" fill="#2e5158" font-family="system-ui,'Noto Sans SC',sans-serif"><text x="315.5" y="435" text-anchor="middle">最小值 1/e</text><text x="347.8" y="385" text-anchor="middle">A</text><text x="765.5" y="435" text-anchor="middle">(1+e)/e</text><text x="797.8" y="385" text-anchor="middle">C</text><text x="797.8" y="458" text-anchor="middle" fill="#b36b2f">sup H，不取到</text></g>
<path d="M315.5 490V506M315.5 498H797.8M797.8 490V506" stroke="#244b50" stroke-width="2.2"/><path d="M315.5 498L327 492M315.5 498L327 504M797.8 498L786 492M797.8 498L786 504" stroke="#244b50" stroke-width="2.2" fill="none"/>
<text x="556.5" y="486" text-anchor="middle" font-size="18" font-weight="700" fill="#244b50" font-family="system-ui,'Noto Sans SC',sans-serif">H 的直径（两两距离的上确界）= C − 1/e</text>
<rect x="176" y="530" width="648" height="48" rx="14" fill="#e1eee9" stroke="#a8c9be"/><text x="500" y="560" text-anchor="middle" font-size="21" font-weight="700" fill="#24584f" font-family="system-ui,'Noto Sans SC',sans-serif">全部阈度：a ≥ (e⁴ + 1) / (e⁴ − e)</text></svg>