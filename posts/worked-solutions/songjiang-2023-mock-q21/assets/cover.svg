<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="cover-title cover-desc">
<title id="cover-title">指数数列删项与阈度</title><desc id="cover-desc">原数列删除每三个位置的项后，保留位置分成奇偶两支等比数列；归一化部分和形成两组离散值，最小值为1除以e，上确界为C，阈度下界为C减1除以e。</desc>
<rect width="760" height="440" rx="24" fill="#f3f8f6"/><text x="44" y="64" font-size="26" font-weight="700" fill="#244b50" font-family="system-ui,'Noto Sans SC',sans-serif">指数函数 × 删项数列 × 集合阈度</text>
<g transform="translate(52 110)"><rect x="0" y="0" width="190" height="86" rx="16" fill="#e1eee9" stroke="#77a99b"/><text x="95" y="34" text-anchor="middle" font-size="18" fill="#285b52" font-family="system-ui,'Noto Sans SC',sans-serif">微分等式</text><text x="95" y="66" text-anchor="middle" font-size="23" font-weight="700" fill="#285b52" font-family="system-ui,sans-serif">f = f′</text><path d="M202 43H242M232 34L242 43L232 52" stroke="#718b8c" stroke-width="2.5" fill="none"/><rect x="254" y="0" width="190" height="86" rx="16" fill="#e7edf8" stroke="#8b9fc2"/><text x="349" y="34" text-anchor="middle" font-size="18" fill="#3b537c" font-family="system-ui,'Noto Sans SC',sans-serif">唯一指数函数</text><text x="349" y="66" text-anchor="middle" font-size="23" font-weight="700" fill="#3b537c" font-family="system-ui,sans-serif">e^(x+1)</text><path d="M456 43H496M486 34L496 43L486 52" stroke="#718b8c" stroke-width="2.5" fill="none"/><rect x="508" y="0" width="150" height="86" rx="16" fill="#f8eadb" stroke="#d2a071"/><text x="583" y="34" text-anchor="middle" font-size="18" fill="#875628" font-family="system-ui,'Noto Sans SC',sans-serif">删项后</text><text x="583" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#875628" font-family="system-ui,'Noto Sans SC',sans-serif">奇 / 偶分支</text></g>
<path d="M90 270H670" stroke="#617b80" stroke-width="2.2"/><circle cx="150" cy="270" r="8" fill="#356f9c"/><circle cx="210" cy="270" r="6" fill="#356f9c"/><circle cx="270" cy="270" r="5" fill="#356f9c"/><circle cx="500" cy="270" r="8" fill="#b36b2f"/><circle cx="560" cy="270" r="6" fill="#b36b2f"/><circle cx="620" cy="270" r="5" fill="#b36b2f"/>
<text x="210" y="236" text-anchor="middle" font-size="17" fill="#356f9c" font-family="system-ui,'Noto Sans SC',sans-serif">奇数项：趋近 A</text><text x="560" y="236" text-anchor="middle" font-size="17" fill="#b36b2f" font-family="system-ui,'Noto Sans SC',sans-serif">偶数项：趋近 C</text><text x="150" y="302" text-anchor="middle" font-size="15" fill="#244b50" font-family="system-ui,sans-serif">1/e</text><text x="620" y="302" text-anchor="middle" font-size="15" fill="#244b50" font-family="system-ui,sans-serif">C（不取到）</text>
<rect x="88" y="340" width="584" height="62" rx="16" fill="#e1eee9" stroke="#a8c9be"/><text x="380" y="378" text-anchor="middle" font-size="24" font-weight="700" fill="#24584f" font-family="system-ui,'Noto Sans SC',sans-serif">阈度下界 = (e⁴ + 1) / (e⁴ − e)</text></svg>