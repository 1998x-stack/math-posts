<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="q20t q20d"><title id="q20t">椭圆外点引弦、中点轨迹与固定交点</title><desc id="q20d">椭圆y平方除以5加x平方除以4等于1，外点P在4,0；一条割线经过P与椭圆交于C、D，中点M在弦上，AC与BD交于Q且横坐标为1。</desc><rect width="720" height="360" rx="20" fill="#f4f9f7"/><path d="M55 180H650M300 30V325" stroke="#526b74" stroke-width="2"/><ellipse cx="300" cy="180" rx="110" ry="123" fill="#e2f0ea" stroke="#237b80" stroke-width="3"/><path d="M190 180L406 214M410 180L224 269" stroke="#167e85" stroke-width="2.5"/><path d="M190 180L520 180" stroke="#b8c6c8" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M224 269L406 214L520 180" stroke="#d9825c" stroke-width="3"/><circle cx="190" cy="180" r="5" fill="#234352"/><circle cx="410" cy="180" r="5" fill="#234352"/><circle cx="520" cy="180" r="7" fill="#d9825c"/><circle cx="406" cy="214" r="6" fill="#167e85"/><circle cx="224" cy="269" r="6" fill="#167e85"/><circle cx="315" cy="242" r="6" fill="#a45e3c"/><circle cx="355" cy="206" r="6" fill="#234352"/><path d="M315 242L406 214" stroke="#a45e3c" stroke-dasharray="4 4"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="15"><text x="173" y="168">A(−2,0)</text><text x="410" y="168">B(2,0)</text><text x="528" y="175">P(4,0)</text><text x="413" y="207">C</text><text x="207" y="287">D</text><text x="301" y="263">M</text><text x="362" y="200">Q</text><text x="70" y="43">y²/5+x²/4=1</text><text x="70" y="330" fill="#a45e3c">图中 M 为弦 CD 中点；Q 为 AC 与 BD 的交点</text></g></svg>