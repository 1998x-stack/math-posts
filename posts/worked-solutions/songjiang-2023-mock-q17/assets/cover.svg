<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="B、C、A构成一个竖直平面，CD垂直于此平面，所以D在ABC面的正投影为C。AD在ABC内的投影是AC，所求角是DAC。"><title>三棱锥A-BCD的平面垂直与AD投影</title><desc>B、C、A构成一个竖直平面，CD垂直于此平面，所以D在ABC面的正投影为C。AD在ABC内的投影是AC，所求角是DAC。</desc><rect width="760" height="360" rx="22" fill="#f2f9f7"/><polygon points="235,158 235,275 417,317" fill="#cfeae5" fill-opacity=".85"/><polygon points="235,158 417,317 509,249" fill="#eedbc9" fill-opacity=".6"/><path d="M235,158L235,275" fill="none" stroke="#21857c" stroke-width="3" /><path d="M235,275L417,317" fill="none" stroke="#21857c" stroke-width="3" /><path d="M417,317L235,158" fill="none" stroke="#21857c" stroke-width="3" /><path d="M417,317L509,249" fill="none" stroke="#cc784d" stroke-width="4" /><path d="M235,158L509,249" fill="none" stroke="#cd784a" stroke-width="3.5" /><path d="M235,275L509,249" fill="none" stroke="#7b9c9b" stroke-width="2" stroke-dasharray="6 5"/><circle cx="235" cy="158" r="5" fill="#c67850"/><text x="244" y="149" font-size="20" fill="#2d5660">A</text><circle cx="235" cy="275" r="5" fill="#c67850"/><text x="218" y="295" font-size="20" fill="#2d5660">B</text><circle cx="417" cy="317" r="5" fill="#c67850"/><text x="427" y="341" font-size="20" fill="#2d5660">C</text><circle cx="509" cy="249" r="5" fill="#c67850"/><text x="519" y="259" font-size="20" fill="#2d5660">D</text><text x="48" y="52" font-size="24" font-weight="700" fill="#2b555c" font-family="system-ui,'Noto Sans SC',sans-serif">CD ⟂ 平面 ABC　⇒　AD 的投影是 AC</text><text x="53" y="98" font-size="18" fill="#527274" font-family="system-ui,'Noto Sans SC',sans-serif">AB=1，BC=2，CD=2</text><rect x="465" y="240" width="253" height="80" rx="12" fill="#fff" stroke="#d9e7df"/><text x="480" y="270" font-size="18" fill="#2f6265" font-family="system-ui,'Noto Sans SC',sans-serif">AC = √5　AD = 3</text><text x="480" y="302" font-size="17" fill="#af724b" font-family="system-ui,'Noto Sans SC',sans-serif">cos ∠DAC = √5/3</text></svg>