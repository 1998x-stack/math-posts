<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="q18t q18d"><title id="q18t">山坡观察者位置与塔顶塔底视角</title><desc id="q18d">塔底A位于220米高处，塔顶B位于300米高处；观察者沿过C点斜率二分之一的山坡移动，在P等于320,60时视角最大。</desc><rect width="720" height="360" rx="20" fill="#f4f9f7"/><path d="M70 300H660M130 325V35" stroke="#526b74" stroke-width="2"/><path d="M130 300V75" stroke="#234352" stroke-width="5"/><path d="M130 75V20" stroke="#d9825c" stroke-width="7"/><path d="M130 300L620 55" stroke="#167e85" stroke-width="3"/><path d="M130 75L435 147M130 20L435 147" stroke="#d9825c" stroke-width="2.5"/><circle cx="435" cy="147" r="7" fill="#167e85"/><path d="M435 147L130 75M435 147L130 20" stroke="#167e85" stroke-width="2" stroke-dasharray="6 5"/><path d="M130 20H150M130 75H150" stroke="#526b74" stroke-width="1.5"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="15"><text x="104" y="18">B(0,300)</text><text x="100" y="67">A(0,220)</text><text x="115" y="320">O</text><text x="115" y="286">C(200,0)</text><text x="445" y="142" font-weight="700">P(320,60)</text><text x="550" y="86">斜坡斜率 1/2</text><text x="260" y="52" fill="#a45e3c">视角 θ 最大</text></g><path d="M435 147L460 145L451 125" fill="none" stroke="#d9825c" stroke-width="2"/></svg>