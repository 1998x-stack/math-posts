<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="取B=(0,0)、A=(4/√3,0)、C=(1/√3,1)，则∠B=60°，边a=2/√3，b=2，c=4/√3，面积为2√3/3。"><title>B角60度的三角形精确比例图</title><desc>取B=(0,0)、A=(4/√3,0)、C=(1/√3,1)，则∠B=60°，边a=2/√3，b=2，c=4/√3，面积为2√3/3。</desc><rect width="760" height="360" rx="22" fill="#f2f9f7"/><polygon points="516.4101615137755,286 170,286 256.6025403784439,136" fill="#d6ebe5" stroke="#16857d" stroke-width="3"/><path d="M219 286A49 49 0 0 0 194.5 243.6" fill="none" stroke="#c7804f" stroke-width="3"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#29525b" font-size="19"><text x="525.4101615137755" y="304">A</text><text x="152" y="306">B</text><text x="247.6025403784439" y="121">C</text><text x="247" y="279" fill="#bd774b">60°</text><text x="296" y="312">c = 4/√3</text><text x="170" y="180">a = 2/√3</text><text x="401" y="191">b = 2</text><text x="55" y="54" font-size="22" font-weight="700">正弦定理 → B=π/3 → 面积定 a → 余弦定 b</text><text x="48" y="344" font-size="17">周长 = 2√3 + 2；所有坐标按边长和夹角比例构造</text></g></svg>