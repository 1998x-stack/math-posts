<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="q17t q17d"><title id="q17t">三棱锥P-ABC的底面关系与二面角</title><desc id="q17d">底面ABC为等边三角形，D是P在底面的射影，DB平行AC；P位于D正上方，两个阴影平面沿AB形成二面角。</desc><rect width="720" height="360" rx="20" fill="#f4f9f7"/><polygon points="155,260 505,260 330,85" fill="#dceee7" stroke="#237b80" stroke-width="3"/><polygon points="155,260 505,260 330,85 330,30" fill="#f5e7dd" fill-opacity=".55" stroke="#d9825c" stroke-width="2"/><path d="M155 260L330 190L505 260M330 30L155 260M330 30L505 260M330 30L330 190" fill="none" stroke="#526b74" stroke-width="2.5"/><path d="M330 190L505 260" stroke="#167e85" stroke-width="4"/><path d="M155 260L330 85" stroke="#167e85" stroke-width="4"/><path d="M330 190L330 30" stroke="#d9825c" stroke-width="3" stroke-dasharray="6 5"/><path d="M330 190L155 260" stroke="#d9825c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="330" cy="190" r="6" fill="#234352"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="17"><text x="136" y="279">A</text><text x="515" y="279">B</text><text x="330" y="75">C</text><text x="342" y="195">D</text><text x="342" y="28">P</text><text x="375" y="215" fill="#167e85">DB ∥ AC</text><text x="535" y="90" fill="#a45e3c">∠P−AB−C</text></g><path d="M155 260L505 260" stroke="#234352" stroke-width="4"/></svg>