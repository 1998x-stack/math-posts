<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="q13-title q13-desc">
<title id="q13-title">指定学生被抽到的三条互斥路径</title>
<desc id="q13-desc">5号学生首次出现在第一次、第二次、第三次抽取的概率分别都是十分之一，三条路径互斥且穷尽，所以被抽到的概率是十分之三。6号学生由对称性相同。</desc>
<rect width="760" height="390" rx="18" fill="#f5f9f7"/>
<text x="28" y="38" font-size="22" font-weight="700" fill="#234352">5 号首次出现在哪一次？三条路径刚好覆盖所有情况</text>
<rect x="255" y="62" width="250" height="52" rx="12" fill="#e6f1ed" stroke="#9dbfb5"/>
<text x="380" y="94" text-anchor="middle" font-size="19" font-weight="700" fill="#234352">指定学生：5 号</text>
<g stroke="#7ba9a2" stroke-width="2.5" fill="none"><path d="M380 114V142H130V177"/><path d="M380 142V177"/><path d="M380 142H630V177"/></g>
<g>
<rect x="28" y="177" width="204" height="118" rx="12" fill="#ffffff" stroke="#9dbfb5"/>
<rect x="278" y="177" width="204" height="118" rx="12" fill="#ffffff" stroke="#9dbfb5"/>
<rect x="528" y="177" width="204" height="118" rx="12" fill="#ffffff" stroke="#9dbfb5"/>
<text x="130" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#167d80">第 1 次首次出现</text>
<text x="130" y="240" text-anchor="middle" font-size="16" fill="#375360">5 号直接被抽中</text>
<text x="130" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#234352">1/10</text>
<text x="380" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#167d80">第 2 次首次出现</text>
<text x="380" y="240" text-anchor="middle" font-size="15" fill="#375360">先未抽中，再抽中</text>
<text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#234352">(9/10)×(1/9)=1/10</text>
<text x="630" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#167d80">第 3 次首次出现</text>
<text x="630" y="240" text-anchor="middle" font-size="15" fill="#375360">前两次均未抽中</text>
<text x="630" y="272" text-anchor="middle" font-size="16" font-weight="700" fill="#234352">(9/10)×(8/9)×(1/8)</text>
<text x="630" y="290" text-anchor="middle" font-size="14" fill="#234352">=1/10</text>
</g>
<path d="M130 295V320H630V295" stroke="#d9825c" stroke-width="2" fill="none"/>
<text x="380" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#234352">a = 1/10 + 1/10 + 1/10 = 3/10</text>
<text x="380" y="375" text-anchor="middle" font-size="15" fill="#375360">6 号与 5 号完全对称，所以 b 也等于 3/10</text>
</svg>