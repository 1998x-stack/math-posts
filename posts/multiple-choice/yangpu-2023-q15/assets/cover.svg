<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="q15-title q15-desc">
<title id="q15-title">sin B 小于二分之一只覆盖一种钝角三角形情形</title>
<desc id="q15-desc">在 B 从 0 到 120 度的范围内，sin B 小于二分之一只发生在 0 到 30 度；但钝角三角形还允许 B 在 90 到 120 度，所以条件充分而不必要。</desc>
<rect width="760" height="430" rx="18" fill="#f5f9f7"/>
<text x="28" y="38" font-size="22" font-weight="700" fill="#234352">已知 A=60°，所以 B 的范围是 0° 到 120°</text>
<g stroke="#d9e5e1" stroke-width="1"><path d="M80 100H700"/><path d="M80 200H700"/><path d="M80 300H700"/></g>
<path d="M80 300H700" stroke="#657d80" stroke-width="2"/>
<path d="M80 80V300" stroke="#657d80" stroke-width="2"/>
<path d="M80 190H700" stroke="#d9825c" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="690" y="180" text-anchor="end" font-size="15" fill="#a85b3a">sin B = 1/2</text>
<path d="M80.0 300.0 L131.7 261.8 L183.3 224.8 L235.0 190.0 L286.7 158.6 L338.3 131.5 L390.0 109.5 L441.7 93.3 L493.3 83.3 L545.0 80.0 L596.7 83.3 L648.3 93.3 L700.0 109.5" fill="none" stroke="#167d80" stroke-width="4"/>
<g stroke="#657d80" stroke-width="1.5" stroke-dasharray="5 5"><path d="M235 190V332"/><path d="M545 80V332"/><path d="M700 109.5V332"/></g>
<g fill="#234352" font-size="15"><text x="80" y="323" text-anchor="middle">0°</text><text x="235" y="323" text-anchor="middle">30°</text><text x="545" y="323" text-anchor="middle">90°</text><text x="700" y="323" text-anchor="middle">120°</text></g>
<circle cx="235" cy="190" r="6" fill="#d9825c" stroke="white" stroke-width="2"/>
<circle cx="545" cy="80" r="6" fill="#167d80" stroke="white" stroke-width="2"/>
<circle cx="700" cy="109.5" r="6" fill="#167d80" stroke="white" stroke-width="2"/>
<text x="245" y="209" font-size="14" fill="#a85b3a">1/2</text><text x="557" y="73" font-size="14" fill="#167d80">1</text><text x="690" y="99" text-anchor="end" font-size="14" fill="#167d80">√3/2</text>
<rect x="80" y="344" width="155" height="22" rx="5" fill="#7bb69a"/>
<rect x="545" y="344" width="155" height="22" rx="5" fill="#e4b28d"/>
<text x="157.5" y="383" text-anchor="middle" font-size="15" font-weight="700" fill="#35764e">sin B&lt;1/2</text>
<text x="622.5" y="383" text-anchor="middle" font-size="15" font-weight="700" fill="#a85b3a">另一种钝角情形</text>
<text x="380" y="414" text-anchor="middle" font-size="14" fill="#657d80">钝角 ⇔ B∈(0°,30°)∪(90°,120°)；正弦条件只覆盖左侧区间。</text>
</svg>