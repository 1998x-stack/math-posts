<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">复数模为二分之一的圆</title><desc id="fig-desc">复平面中以原点为圆心、半径二分之一的圆。任意角度theta的点z都在此圆上；共轭z加一除以z等于二分之一加二的倒数乘以e的负i theta次方，其模恒为五除以二。</desc><rect width="960" height="490" rx="24" fill="#f5faf7"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="43" y="47" font-size="25" font-weight="750" fill="#214953">模只取决于半径 r，与辐角 θ 无关</text><rect x="32" y="65" width="560" height="390" rx="18" fill="#fff" stroke="#dbe9e2"/><path d="M90 270H545M320 100V430" stroke="#8fa9a3" stroke-width="1.8"/><circle cx="320" cy="270" r="125" fill="#e4f1eb" stroke="#167d80" stroke-width="3.2"/><path d="M320 270L422.4 196.8" stroke="#c18b56" stroke-width="3.2"/><circle cx="422.4" cy="196.8" r="7" fill="#c18b56" stroke="#fff" stroke-width="2"/><path d="M370 270A50 50 0 0 0 360.5 240.6" fill="none" stroke="#c18b56" stroke-width="2"/><g fill="#315760" font-size="17"><text x="331" y="288">O</text><text x="431" y="190">z</text><text x="550" y="263">Re</text><text x="330" y="101">Im</text><text x="372" y="253">θ</text><text x="330" y="330">r = 1/2</text></g><path d="M320 395H445" stroke="#167d80" stroke-width="2"/><text x="382" y="420" text-anchor="middle" font-size="15" fill="#557078">圆上任一点均满足 |z|=1/2</text><rect x="615" y="65" width="317" height="390" rx="18" fill="#fff" stroke="#dbe9e2"/><g fill="#284f58" font-size="18"><text x="642" y="112" font-size="20" font-weight="750">极形式拆解</text><text x="642" y="165">z = r e^(iθ)</text><text x="642" y="205">z̄ = r e^(−iθ)</text><text x="642" y="245">1/z = r⁻¹ e^(−iθ)</text><path d="M642 270H903" stroke="#dbe9e2"/><text x="642" y="313">z̄ + 1/z</text><text x="642" y="345">= (r + 1/r)e^(−iθ)</text><text x="642" y="395" font-size="22" font-weight="750" fill="#167d80">r + 1/r = 5/2</text></g></g></svg>