<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="svg-title-15 svg-desc-15"><title id="svg-title-15">两个向量的合成长度从 5 到 7，k=2 对应合长度 6</title><desc id="svg-desc-15">向量 2c 的长度为 6，向量 a 的长度为 1；它们的合向量长度可以介于 5 与 7 之间。图示构造使合向量长度等于 6，因此 3|b|=6、k=2。</desc><rect width="720" height="360" rx="20" fill="#f4f9f7"/><defs><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#167d80"/></marker><marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#bd7a4c"/></marker><marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#294c54"/></marker></defs><g font-family="system-ui,sans-serif"><text x="360" y="28" text-anchor="middle" font-size="22" font-weight="700" fill="#294c54">向量合成：|a|=1，|2c|=6，|a+2c|=6</text><path d="M100 260H490" stroke="#167d80" stroke-width="4" marker-end="url(#arrow-teal)"/><path d="M100 260L94.6 195.2" stroke="#bd7a4c" stroke-width="4" marker-end="url(#arrow-orange)"/><path d="M100 260L484.6 195.2" stroke="#294c54" stroke-width="4" marker-end="url(#arrow-dark)"/><path d="M490 260L484.6 195.2M94.6 195.2L484.6 195.2" stroke="#9aada9" stroke-width="2" stroke-dasharray="7 5"/><circle cx="100" cy="260" r="5" fill="#294c54"/><g fill="#294c54" font-size="17"><text x="255" y="286" fill="#167d80">2c：长度 6</text><text x="30" y="178" fill="#bd7a4c">a：长度 1</text><text x="278" y="178">合向量 a+2c：长度 6</text><text x="115" y="246">θ，cosθ=−1/12</text><text x="95" y="285">O</text><text x="500" y="252">2c</text><text x="500" y="185">a+2c=3b</text></g><path d="M80 315H640" stroke="#81999d" stroke-width="3"/><path d="M80 308V322M640 308V322" stroke="#81999d" stroke-width="2"/><path d="M80 315H640" stroke="#167d80" stroke-width="5" stroke-linecap="round"/><circle cx="360" cy="315" r="8" fill="#bd7a4c" stroke="#fff" stroke-width="2"/><g fill="#294c54" font-size="16"><text x="80" y="344">5/3</text><text x="360" y="344" text-anchor="middle">k=2 可取</text><text x="640" y="344" text-anchor="end">7/3</text></g></g></svg>
