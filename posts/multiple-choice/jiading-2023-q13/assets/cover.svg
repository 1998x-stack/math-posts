<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">充分与非必要的两种三角形</title><desc id="svg-desc">左侧钝角为 A，右侧钝角为 B，两者都是钝角三角形，但题设仅保证 A 为钝角。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176f78"/></marker></defs><rect width="720" height="380" rx="22" fill="#f5faf8"/><path d="M92 277L250 277L35 105Z" stroke="#176f78" fill="#dcefea" stroke-width="4"/><path d="M440 277L300 277L530 110Z" stroke="#d87b55" fill="#f8e9dd" stroke-width="4"/><text x="70" y="296" font-size="16" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">A</text><text x="254" y="296" font-size="16" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">B</text><text x="25" y="100" font-size="16" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">C</text><text x="442" y="297" font-size="16" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">B</text><text x="287" y="297" font-size="16" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">A</text><text x="535" y="106" font-size="16" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">C</text><text x="42" y="56" font-size="18" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">不等式成立 → A 钝</text><text x="395" y="56" font-size="18" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">B 钝也属于钝角三角形</text><text x="80" y="322" font-size="14" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">充分例子</text><text x="455" y="322" font-size="14" fill="#244250" font-family="system-ui,'PingFang SC',sans-serif">必要性反例</text><text x="24" y="352" fill="#516775" font-size="13">2023 嘉定一模 · 第 13 题 · 原创数学示意</text></svg>