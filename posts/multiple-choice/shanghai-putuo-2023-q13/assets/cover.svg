<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="svg-title-13 svg-desc-13"><title id="svg-title-13">不同平面法向方向的反例与平行平面的垂线传递</title><desc id="svg-desc-13">左图以互相垂直的两个平面展示两条法线不必平行；右图展示同一条直线垂直于两个平行平面。</desc><rect width="720" height="360" rx="20" fill="#f4f9f7"/><g font-family="system-ui,sans-serif"><text x="180" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#294c54">反例：垂直于不同平面，方向不必平行</text><polygon points="45,218 235,218 300,172 110,172" fill="#d7e9e3" stroke="#4b8581" stroke-width="2"/><polygon points="125,60 190,96 190,256 125,220" fill="#f2dfd0" fill-opacity=".9" stroke="#bd7a4c" stroke-width="2"/><path d="M78 208V70" stroke="#167d80" stroke-width="4"/><path d="M205 263H332" stroke="#bd7a4c" stroke-width="4"/><path d="M78 70l-7 13h14z" fill="#167d80"/><path d="M332 263l-13-7v14z" fill="#bd7a4c"/><g fill="#294c54" font-size="16"><text x="50" y="235">α（水平面）</text><text x="195" y="80">β（竖直面）</text><text x="88" y="65" fill="#167d80">l ⟂ α</text><text x="235" y="285" fill="#bd7a4c">m ⟂ β</text><text x="48" y="320">l 与 m 不平行：D 不成立</text></g><path d="M360 45V325" stroke="#d5e2dd" stroke-width="2"/><text x="540" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#294c54">正确关系：α∥β，l⊥α ⇒ l⊥β</text><polygon points="400,210 585,210 650,170 465,170" fill="#d7e9e3" stroke="#4b8581" stroke-width="2"/><polygon points="420,115 605,115 670,75 485,75" fill="#d7e9e3" stroke="#4b8581" stroke-width="2"/><path d="M530 245V48" stroke="#167d80" stroke-width="4"/><path d="M530 48l-7 13h14z" fill="#167d80"/><path d="M530 210V115" stroke="#167d80" stroke-width="3" stroke-dasharray="6 5"/><g fill="#294c54" font-size="16"><text x="410" y="232">α</text><text x="430" y="98">β（与 α 平行）</text><text x="544" y="58" fill="#167d80">l</text><text x="560" y="292">同一法向方向</text><text x="540" y="320" text-anchor="middle">C 成立</text></g></g></svg>
