<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="天狼星亮度设为1时太阳亮度为10的10.1次幂，在以10为底的对数亮度刻度上两者相差10.1。"><title>恒星亮度的对数刻度差</title><desc>天狼星亮度设为1时太阳亮度为10的10.1次幂，在以10为底的对数亮度刻度上两者相差10.1。</desc><rect width="760" height="360" rx="22" fill="#f2f9f7"/><text x="52" y="49" font-size="24" fill="#2b565e" font-weight="700" font-family="system-ui,'Noto Sans SC',sans-serif">星等差 25.25 → lg(亮度比) = 10.1</text><path d="M93 218H689" stroke="#708f94" stroke-width="3"/><path d="M679 212l10 6-10 6" stroke="#708f94" stroke-width="2" fill="none"/><g font-family="system-ui,'Noto Sans SC',sans-serif" font-size="17" fill="#385a61" text-anchor="middle"><path d="M110 207V228" stroke="#708f94" stroke-width="2"/><text x="110" y="256">0</text><path d="M212 207V228" stroke="#708f94" stroke-width="2"/><text x="212" y="256">2</text><path d="M314 207V228" stroke="#708f94" stroke-width="2"/><text x="314" y="256">4</text><path d="M416 207V228" stroke="#708f94" stroke-width="2"/><text x="416" y="256">6</text><path d="M518 207V228" stroke="#708f94" stroke-width="2"/><text x="518" y="256">8</text><path d="M620 207V228" stroke="#708f94" stroke-width="2"/><text x="620" y="256">10</text></g><circle cx="110" cy="218" r="10" fill="#527b9b" stroke="#fff" stroke-width="2"/><circle cx="625.1" cy="218" r="11" fill="#d99c49" stroke="#fff" stroke-width="2"/><path d="M110 141H625.1M110 132v18M625.1 132v18" stroke="#d49a4f" stroke-width="3"/><text x="320" y="125" font-size="21" fill="#b0743e" font-family="system-ui,'Noto Sans SC',sans-serif">10.1 个对数单位</text><text x="58" y="300" font-size="17" fill="#3c6470" font-family="system-ui,'Noto Sans SC',sans-serif">天狼星：log₁₀(E/E天狼星)=0</text><text x="402" y="326" font-size="17" fill="#b27840" font-family="system-ui,'Noto Sans SC',sans-serif">太阳：log₁₀(E/E天狼星)=10.1</text><text x="52" y="74" font-size="17" fill="#698080" font-family="system-ui,'Noto Sans SC',sans-serif">注意：图中横轴是对数尺度，不是实际亮度的线性柱状图</text></svg>