<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 415" role="img" aria-labelledby="q14t q14d"><title id="q14t">向量b在a方向的投影长度与向量结果</title><desc id="q14d">a向右长度2，b长度1与a夹角60度。b的水平投影是从原点指向投影脚的橙色向量，其长度是二分之一，只占a的四分之一，因此投影向量是a除以四。</desc><rect width="860" height="415" rx="20" fill="#f2f9f6"/><rect x="22" y="22" width="816" height="359" rx="15" fill="#fff" stroke="#d6e7de"/><defs><marker id="arr14a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#118577"/></marker><marker id="arr14b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5376a6"/></marker><marker id="arr14p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d1884f"/></marker></defs><path d="M145 310H754" stroke="#bdcfca" stroke-width="2"/><path d="M145 310L585 310" stroke="#118577" stroke-width="5" fill="none" marker-end="url(#arr14a)"/><path d="M145 310L255 119.47" stroke="#5376a6" stroke-width="4.5" fill="none" marker-end="url(#arr14b)"/><path d="M145 310L255 310" stroke="#d1884f" stroke-width="7" fill="none" marker-end="url(#arr14p)"/><path d="M255 119.47V310" stroke="#97b4b6" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M240 310V295H255" fill="none" stroke="#9daeb1" stroke-width="2"/><path d="M213 310A68 68 0 0 0 179 251.11" stroke="#bf9a65" stroke-width="2.5" fill="none"/><circle cx="145" cy="310" r="5" fill="#536b70"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#254754" font-size="20"><text x="43" y="59" font-size="24" font-weight="700">投影长度 ≠ 投影向量</text><text x="589" y="320" fill="#087a70" font-weight="700">a（长度2）</text><text x="263" y="119" fill="#5376a6" font-weight="700">b（长度1）</text><text x="178" y="237" fill="#af7a46">60°</text><text x="176" y="335" fill="#b8713e" font-weight="700">a/4</text><text x="269" y="228" fill="#4c7c83">垂线</text><text x="480" y="147" font-size="26" fill="#0f8175" font-weight="800">|投影| = 1/2</text><text x="480" y="194" font-size="26" fill="#b8723d" font-weight="800">投影向量 = a/4</text><text x="131" y="336" font-size="17">O</text><text x="255" y="337" font-size="16">H</text></g></svg>
