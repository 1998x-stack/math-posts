<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="q14title q14desc"><title id="q14title">充分条件与必要条件的解集包含关系</title><desc id="q14desc">在共同定义域 x 不等于零上，命题 P 的解集是零到一与一到正无穷，命题 Q 的解集是除零和一外的所有实数。P 的解集真包含于 Q 的解集，x 等于负一是 Q 真而 P 假的反例。</desc><rect width="720" height="340" rx="22" fill="#f5f9f7"/><text x="34" y="48" fill="#315964" font-size="19" font-weight="700" font-family="system-ui,sans-serif">P：x + 1/x &gt; 2</text><text x="34" y="194" fill="#315964" font-size="19" font-weight="700" font-family="system-ui,sans-serif">Q：x ≠ 1（共同定义域 x ≠ 0）</text><path d="M70 110H660M70 255H660" stroke="#94aab0" stroke-width="2"/><path d="M70 110l12 -6v12zM660 110l-12 -6v12zM70 255l12 -6v12zM660 255l-12 -6v12z" fill="#94aab0"/><path d="M355 110H440M440 110H660" stroke="#17877b" stroke-width="9" stroke-linecap="round"/><path d="M70 255H355M355 255H440M440 255H660" stroke="#4e91a1" stroke-width="9" stroke-linecap="round"/><circle cx="355" cy="110" r="8" fill="#fff" stroke="#17877b" stroke-width="3"/><circle cx="440" cy="110" r="8" fill="#fff" stroke="#17877b" stroke-width="3"/><circle cx="355" cy="255" r="8" fill="#fff" stroke="#4e91a1" stroke-width="3"/><circle cx="440" cy="255" r="8" fill="#fff" stroke="#4e91a1" stroke-width="3"/><circle cx="270" cy="255" r="7" fill="#d87952" stroke="#fff" stroke-width="2"/><text x="270" y="285" text-anchor="middle" fill="#b35f3e" font-size="15" font-weight="700" font-family="system-ui,sans-serif">x = −1</text><text x="185" y="132" text-anchor="middle" fill="#526d77" font-size="14" font-family="system-ui,sans-serif">-2</text><text x="270" y="132" text-anchor="middle" fill="#526d77" font-size="14" font-family="system-ui,sans-serif">-1</text><text x="355" y="132" text-anchor="middle" fill="#526d77" font-size="14" font-family="system-ui,sans-serif">0</text><text x="440" y="132" text-anchor="middle" fill="#526d77" font-size="14" font-family="system-ui,sans-serif">1</text><text x="525" y="132" text-anchor="middle" fill="#526d77" font-size="14" font-family="system-ui,sans-serif">2</text><text x="360" y="321" text-anchor="middle" fill="#536f78" font-size="15" font-family="system-ui,sans-serif">P 的解集 ⊊ Q 的解集：P 能推出 Q，但 Q 不能推出 P</text></svg>
