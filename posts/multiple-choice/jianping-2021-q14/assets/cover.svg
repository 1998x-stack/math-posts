<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="q14t q14d"><title id="q14t">63的因数对经过正整数约束筛选</title><desc id="q14d">63的有序因数对为1乘63、3乘21和7乘9；第一组因n为零被排除，后两组对应两个生成点。</desc><rect width="720" height="340" rx="20" fill="#f4f9f7"/><rect x="245" y="22" width="230" height="55" rx="12" fill="#e5f1ec" stroke="#9fc8bb"/><text x="360" y="56" text-anchor="middle" fill="#234352" font-size="24" font-weight="700">p × q = 63</text><path d="M360 77V105M145 105H575M145 105V128M360 105V128M575 105V128" fill="none" stroke="#789b95" stroke-width="2"/><g font-family="system-ui,sans-serif" text-anchor="middle"><rect x="55" y="128" width="180" height="95" rx="12" fill="#f5e8df" stroke="#d6a17f"/><text x="145" y="162" fill="#8d5739" font-size="21">1 × 63</text><text x="145" y="194" fill="#8d5739" font-size="15">n=0，不合法</text><rect x="270" y="128" width="180" height="95" rx="12" fill="#e3f2ed" stroke="#86b9aa"/><text x="360" y="162" fill="#167e85" font-size="21">3 × 21</text><text x="360" y="194" fill="#234352" font-size="15">x₀=9，n=2</text><rect x="485" y="128" width="180" height="95" rx="12" fill="#e3f2ed" stroke="#86b9aa"/><text x="575" y="162" fill="#167e85" font-size="21">7 × 9</text><text x="575" y="194" fill="#234352" font-size="15">x₀=1，n=6</text></g><path d="M360 223V255M575 223V255M360 255H575" stroke="#167e85" stroke-width="2"/><text x="467" y="286" fill="#167e85" text-anchor="middle" font-size="20" font-weight="700">2 个生成点</text><text x="360" y="322" fill="#526b74" text-anchor="middle" font-size="14">还要检查 q−p=2x₀ 为正偶数</text></svg>