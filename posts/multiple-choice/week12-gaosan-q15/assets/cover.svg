<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" role="img" aria-labelledby="q15t q15d"><title id="q15t">乘积t允许区间与无约束极小点的两种位置</title><desc id="q15d">取a等于1时乘积t范围零到1，目标函数的自由极小点根号2位于范围之外，故区间最小值只在t等于a平方即x等于y时出现。取a等于1.5时范围到2.25，自由极小点根号3约1.732位于区间内部，此时x不等于y也能取到更小值。临界a为立方根2，含等号。</desc><rect width="900" height="485" rx="20" fill="#f2f9f6"/><rect x="22" y="22" width="855" height="211" rx="15" fill="#fff" stroke="#d7e7df"/><rect x="22" y="246" width="855" height="214" rx="15" fill="#fff" stroke="#d7e7df"/><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#264752" font-size="19"><text x="42" y="58" font-size="23" font-weight="700">情形一：a=1（符合条件）</text><text x="42" y="283" font-size="23" font-weight="700">情形二：a=3/2（不符合条件）</text></g><g stroke="#81989c" stroke-width="2.5"><path d="M135 157H774M135 382H774"/></g><g fill="#dfeee7"><rect x="135" y="143" width="200" height="28" rx="10"/><rect x="135" y="368" width="450" height="28" rx="10"/></g><g stroke="#168879" stroke-width="4"><path d="M135 157H335M135 382H585"/></g><g fill="#fff" stroke="#178777" stroke-width="2.5"><circle cx="135" cy="157" r="6"/><circle cx="135" cy="382" r="6"/></g><g fill="#d2874f" stroke="#fff" stroke-width="3"><circle cx="335" cy="157" r="9"/><circle cx="585" cy="382" r="9"/></g><g fill="#5376a4" stroke="#fff" stroke-width="3"><circle cx="418" cy="157" r="9"/><circle cx="481.4" cy="382" r="9"/></g><g font-family="system-ui,'Noto Sans SC',sans-serif" fill="#244653" font-size="18"><text x="122" y="189">0</text><text x="286" y="126" fill="#b46f3d">a²=1</text><text x="398" y="126" fill="#5376a4">t₀=√2</text><text x="40" y="215" font-size="17">t₀ 在可行域之外 ⇒ 唯一最小点 t=a²（x=y）</text><text x="123" y="417">0</text><text x="440" y="352" fill="#5376a4">t₀=√3</text><text x="555" y="352" fill="#b46f3d">a²=9/4</text><text x="41" y="443" font-size="17">t₀ 位于可行域内部 ⇒ 有 x≠y 的更优取值</text><text x="713" y="167" font-size="16">t</text><text x="713" y="393" font-size="16">t</text><text x="581" y="80" font-size="22" font-weight="700" fill="#0b7d70">判据：a² ≤ √(2a)</text></g></svg>
