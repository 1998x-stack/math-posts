<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="q13t q13d"><title id="q13t">平面内直线与平行平面外直线的等距轨迹</title><desc id="q13d">浅色平面为α，平面内直线l与投影线m撇相交；空间直线m位于平面上方固定高度h。点P到l的距离等于到m的空间距离时形成双曲线。</desc><rect width="720" height="360" rx="20" fill="#f4f9f7"/><polygon points="90,250 455,250 630,145 265,145" fill="#dceee7" stroke="#237b80" stroke-width="2"/><text x="565" y="230" fill="#234352" font-size="17">平面 α</text><path d="M160 250L510 145" stroke="#234352" stroke-width="4"/><text x="505" y="137" fill="#234352" font-size="16">l</text><path d="M265 145L455 250" stroke="#d9825c" stroke-width="3" stroke-dasharray="7 5"/><text x="460" y="267" fill="#a45e3c" font-size="16">m′（投影）</text><path d="M335 62L525 167" stroke="#167e85" stroke-width="5"/><text x="530" y="165" fill="#167e85" font-size="16">m</text><path d="M525 167L455 250" stroke="#167e85" stroke-width="2" stroke-dasharray="5 5"/><path d="M525 167L525 250" stroke="#d9825c" stroke-width="2.5" stroke-dasharray="5 5"/><text x="535" y="214" fill="#a45e3c" font-size="15">h</text><circle cx="335" cy="205" r="7" fill="#234352"/><text x="316" y="194" fill="#234352" font-size="16">P</text><path d="M335 205L310 250" stroke="#d9825c" stroke-width="3"/><path d="M335 205L430 220" stroke="#167e85" stroke-width="3"/><text x="255" y="284" fill="#a45e3c" font-size="14">d(P,l)</text><text x="395" y="205" fill="#167e85" font-size="14">平面投影距离</text><text x="90" y="320" fill="#234352" font-size="15">d(P,m)² = d(P,m′)² + h²</text></svg>