<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">斜率为正和负的直线均可与单位圆相交</title><desc id="fig-desc">单位圆x平方加y平方等于一，直线族y等于mx加一都经过一点零一。m等于一和m等于负一时均为割线，m等于零时为切线，因此m大于零是相交的充分但非必要条件。</desc><defs><clipPath id="clip13"><rect x="105" y="90" width="560" height="335" rx="8"/></clipPath></defs><rect width="960" height="490" rx="24" fill="#f5faf7"/><g font-family="system-ui,'PingFang SC',sans-serif"><text x="42" y="45" font-size="24" font-weight="750" fill="#214953">所有直线都经过 (0,1)，但斜率可以为正也可以为负</text><rect x="28" y="64" width="650" height="380" rx="18" fill="#fff" stroke="#dbe9e2"/><g clip-path="url(#clip13)"><path d="M130 290H650M370 95V430" stroke="#8da8a1" stroke-width="1.8"/><circle cx="370" cy="290" r="125" fill="#f4faf7" stroke="#315f68" stroke-width="3"/><path d="M210 325L535 0" stroke="#167d80" stroke-width="3"/><path d="M210 5L535 330" stroke="#5b83ad" stroke-width="3"/><path d="M125 165H635" stroke="#c18b56" stroke-width="2.8" stroke-dasharray="8 5"/><circle cx="370" cy="165" r="6" fill="#c18b56" stroke="#fff" stroke-width="2"/><circle cx="245" cy="290" r="5" fill="#167d80"/><circle cx="495" cy="290" r="5" fill="#5b83ad"/></g><g fill="#355963" font-size="16"><text x="377" y="305">O</text><text x="380" y="151">(0,1)</text><text x="228" y="314">(-1,0)</text><text x="500" y="314">(1,0)</text><text x="642" y="285">x</text><text x="380" y="100">y</text></g><g font-size="17" font-weight="650"><text x="525" y="412" fill="#167d80">m = 1：割线</text><text x="108" y="412" fill="#5b83ad">m = −1：割线</text><text x="470" y="151" fill="#a56e43">m = 0：切线</text></g><rect x="700" y="64" width="232" height="380" rx="18" fill="#fff" stroke="#dbe9e2"/><g fill="#274e57" font-size="17"><text x="722" y="105" font-size="19" font-weight="750">代数核验</text><text x="722" y="153">交点方程：</text><text x="722" y="184">x[(1+m²)x+2m]=0</text><path d="M720 205H910" stroke="#dbe9e2"/><text x="722" y="245">m = 1</text><text x="722" y="271" fill="#167d80">两个交点</text><text x="722" y="316">m = −1</text><text x="722" y="342" fill="#167d80">两个交点</text><text x="722" y="387">m = 0</text><text x="722" y="413" fill="#a56e43">相切（重根）</text></g></g></svg>