<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="q15t q15d"><title id="q15t">椭圆右焦点到右顶点最近，右侧直角三角形给出根号三</title><desc id="q15d">左侧椭圆长半轴5短半轴4，焦点参数3；右焦点F与右顶点P相距2。右侧放大直角三角形PF为斜边2，MF为1，PM为根号3。</desc><rect width="720" height="350" rx="20" fill="#f4f9f7"/><ellipse cx="190" cy="170" rx="130" ry="100" fill="#e2f0ea" stroke="#237b80" stroke-width="3"/><path d="M55 170H340M190 48V292" stroke="#9bb2b0" stroke-width="1.5"/><circle cx="112" cy="170" r="5" fill="#526b74"/><circle cx="268" cy="170" r="6" fill="#d9825c"/><circle cx="320" cy="170" r="6" fill="#167e85"/><path d="M268 170H320" stroke="#d9825c" stroke-width="3"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="14"><text x="95" y="191">F₁</text><text x="260" y="193">F</text><text x="316" y="151">P</text><text x="78" y="58">x²/25+y²/16=1</text><text x="190" y="315" text-anchor="middle">a=5，b=4，c=3；PF=a−c=2</text></g><path d="M365 40V310" stroke="#d8e5df" stroke-width="2"/><text x="535" y="48" fill="#234352" font-size="17" text-anchor="middle">直角三角形 PMF</text><path d="M470 210L630 210L510 141Z" fill="#e4f1ec" stroke="#167e85" stroke-width="3"/><path d="M520 158L530 175L512 185" fill="none" stroke="#d9825c" stroke-width="2"/><circle cx="470" cy="210" r="5" fill="#d9825c"/><circle cx="630" cy="210" r="5" fill="#d9825c"/><circle cx="510" cy="141" r="5" fill="#167e85"/><g fill="#234352" font-family="system-ui,sans-serif" font-size="16"><text x="450" y="232">F</text><text x="638" y="232">P</text><text x="500" y="128">M</text><text x="550" y="232" text-anchor="middle" fill="#a45e3c">PF=2</text><text x="465" y="170">MF=1</text><text x="585" y="165">PM=√3</text></g></svg>