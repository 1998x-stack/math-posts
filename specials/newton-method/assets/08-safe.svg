<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-safe-title 08-safe-desc" viewBox="0 0 640 270" data-export="08-safe.svg"><title id="08-safe-title">带区间保护的牛顿步</title><desc id="08-safe-desc">候选点在区间内可以进一步检查，越界则改用二分中点。</desc><rect width="640" height="270" fill="white" rx="8"/><text x="320.00" y="28.00" fill="#203035" font-size="20" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">先保护区间，再尝试切线预测</text><text x="40.00" y="70.00" fill="#203035" font-size="17" text-anchor="start" font-family="system-ui,Noto Sans CJK SC,sans-serif">候选点在区间内</text><line x1="90.000" y1="96.000" x2="610.000" y2="96.000" stroke="#dce8e4" stroke-width="2"/><line x1="160.000" y1="96.000" x2="460.000" y2="96.000" stroke="#7461ba" stroke-width="7"/><circle cx="160.000" cy="96.000" r="5" fill="#7461ba"/><circle cx="460.000" cy="96.000" r="5" fill="#7461ba"/><text x="160.00" y="121.00" fill="#7461ba" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">a</text><text x="460.00" y="121.00" fill="#7461ba" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">b</text><circle cx="350.000" cy="96.000" r="6" fill="#d06d4d"/><text x="350.00" y="84.00" fill="#d06d4d" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">牛顿候选</text><text x="350.00" y="121.00" fill="#147f80" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">可进一步检查</text><text x="40.00" y="202.00" fill="#203035" font-size="17" text-anchor="start" font-family="system-ui,Noto Sans CJK SC,sans-serif">候选点越界</text><line x1="90.000" y1="228.000" x2="610.000" y2="228.000" stroke="#dce8e4" stroke-width="2"/><line x1="160.000" y1="228.000" x2="460.000" y2="228.000" stroke="#7461ba" stroke-width="7"/><circle cx="160.000" cy="228.000" r="5" fill="#7461ba"/><circle cx="460.000" cy="228.000" r="5" fill="#7461ba"/><text x="160.00" y="253.00" fill="#7461ba" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">a</text><text x="460.00" y="253.00" fill="#7461ba" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">b</text><circle cx="570.000" cy="228.000" r="6" fill="#d06d4d"/><text x="570.00" y="216.00" fill="#d06d4d" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">牛顿候选</text><circle cx="310.000" cy="228.000" r="6" fill="#147f80"/><text x="310.00" y="253.00" fill="#147f80" font-size="15" text-anchor="middle" font-family="system-ui,Noto Sans CJK SC,sans-serif">改取中点</text></svg>