<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="欧几里得余数链。gcd(84,30)=6"><title>欧几里得余数链</title><desc>gcd(84,30)=6</desc><rect width="760" height="360" rx="14" fill="#fbfefd"/><rect x="38" y="74" width="674" height="35" rx="6" fill="#e3eefb"/><text x="55" y="99" fill="#2768b0" font-size="21" font-weight="600">84 = 2×30 + 24</text><rect x="38" y="115" width="674" height="35" rx="6" fill="#e6f3ec"/><text x="55" y="140" fill="#2768b0" font-size="21" font-weight="600">30 = 1×24 + 6</text><rect x="38" y="156" width="674" height="35" rx="6" fill="#e3eefb"/><text x="55" y="181" fill="#d27452" font-size="21" font-weight="600">24 = 4×6 + 0</text><text x="39" y="338" fill="#147f80" font-size="21" font-weight="600">gcd(84,30)=6</text></svg>
