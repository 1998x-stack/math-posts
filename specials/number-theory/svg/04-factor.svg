<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="素因数分解。84=2×2×3×7"><title>素因数分解</title><desc>84=2×2×3×7</desc><rect width="760" height="360" rx="14" fill="#fbfefd"/><text x="38" y="76" fill="#2768b0" font-size="23" font-weight="600">从 84 开始逐个剥离素数因子</text><text x="45" y="120" fill="#147f80" font-size="20" font-weight="600">84 ÷ 2 = 42</text><text x="45" y="150" fill="#147f80" font-size="20" font-weight="600">42 ÷ 2 = 21</text><text x="45" y="180" fill="#147f80" font-size="20" font-weight="600">21 ÷ 3 = 7</text><text x="45" y="210" fill="#d27452" font-size="20" font-weight="600">7 ÷ 7 = 1</text><rect x="335" y="104" width="58" height="54" rx="6" fill="#d9eee6"/><text x="352" y="140" fill="#147f80" font-size="22" font-weight="600">2</text><rect x="408" y="104" width="58" height="54" rx="6" fill="#d9eee6"/><text x="425" y="140" fill="#147f80" font-size="22" font-weight="600">2</text><rect x="481" y="104" width="58" height="54" rx="6" fill="#d9eee6"/><text x="498" y="140" fill="#147f80" font-size="22" font-weight="600">3</text><rect x="554" y="104" width="58" height="54" rx="6" fill="#d9eee6"/><text x="571" y="140" fill="#147f80" font-size="22" font-weight="600">7</text><text x="335" y="334" fill="#53676d" font-size="17" font-weight="600">分解到最后只留下素数。</text></svg>
