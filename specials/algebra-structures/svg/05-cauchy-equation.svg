<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="任取线性函数 f(t)=ct，它保持加法；这只是连续柯西方程解的实例"><title>函数方程：加法结构</title><desc>任取线性函数 f(t)=ct，它保持加法；这只是连续柯西方程解的实例</desc><rect width="760" height="390" rx="13" fill="#fbfefd"/><rect x="65.00" y="80.00" width="600.00" height="232.00" rx="5" fill="#fff" stroke="none"/><text x="95.00" y="110.00" fill="#273e46" font-size="17" font-weight="500">拆成 x 和 y 后，输出仍可相加</text><rect x="96.00" y="144.00" width="86.72" height="39.00" rx="5" fill="#2768b0" stroke="none"/><rect x="182.72" y="144.00" width="130.08" height="39.00" rx="5" fill="#d27452" stroke="none"/><rect x="96.00" y="229.00" width="216.80" height="39.00" rx="5" fill="#147f80" stroke="none"/><text x="98.00" y="170.00" fill="white" font-size="17" font-weight="500">f(x)</text><text x="184.72" y="170.00" fill="white" font-size="17" font-weight="500">f(y)</text><text x="98.00" y="255.00" fill="white" font-size="17" font-weight="500">f(x+y)</text></svg>