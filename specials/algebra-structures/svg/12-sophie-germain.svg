<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="Sophie Germain 恒等式构造两个正的二次因子，乘积恒等于四次式"><title>多项式恒等式与构造</title><desc>Sophie Germain 恒等式构造两个正的二次因子，乘积恒等于四次式</desc><rect width="760" height="390" rx="13" fill="#fbfefd"/><rect x="80.00" y="60.00" width="600.00" height="258.00" rx="5" fill="#fff" stroke="none"/><text x="104.00" y="100.00" fill="#273e46" font-size="20" font-weight="500">把两个四次幂变成两个二次因子</text><rect x="108.00" y="148.00" width="231.00" height="71.00" rx="5" fill="#e9f4f1" stroke="none"/><rect x="406.00" y="148.00" width="231.00" height="71.00" rx="5" fill="#eaf0fa" stroke="none"/><text x="126.00" y="194.00" fill="#147f80" font-size="23" font-weight="500">因子 A = 5</text><text x="422.00" y="194.00" fill="#2768b0" font-size="23" font-weight="500">因子 B = 29</text><text x="305.00" y="270.00" fill="#d27452" font-size="20" font-weight="500">A × B</text></svg>