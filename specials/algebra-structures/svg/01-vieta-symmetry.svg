<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="三根位置改变时，三种基本对称量由相同的根集合计算"><title>韦达与对称多项式</title><desc>三根位置改变时，三种基本对称量由相同的根集合计算</desc><rect width="760" height="390" rx="13" fill="#fbfefd"/><rect x="48.00" y="46.00" width="657.00" height="284.00" rx="5" fill="#fff" stroke="none"/><line x1="375.00" y1="65.00" x2="375.00" y2="326.00" stroke="#c3d4d1" stroke-width="1.4" /><line x1="49.00" y1="194.00" x2="707.00" y2="194.00" stroke="#c3d4d1" stroke-width="1.4" /><line x1="65.00" y1="196.00" x2="685.00" y2="196.00" stroke="#273e46" stroke-width="1.5" /><circle cx="168.33" cy="196.00" r="7" fill="#147f80" stroke="white" stroke-width="1.8"/><text x="176.33" y="178.00" fill="#147f80" font-size="17" font-weight="500">x</text><circle cx="447.33" cy="196.00" r="7" fill="#2768b0" stroke="white" stroke-width="1.8"/><text x="455.33" y="178.00" fill="#2768b0" font-size="17" font-weight="500">y</text><circle cx="406.00" cy="196.00" r="7" fill="#d27452" stroke="white" stroke-width="1.8"/><text x="414.00" y="178.00" fill="#d27452" font-size="17" font-weight="500">z</text><text x="80.00" y="90.00" fill="#273e46" font-size="17" font-weight="500">交换根的标签不会改变 p、q、r</text><text x="80.00" y="277.00" fill="#668088" font-size="17" font-weight="500">p = x+y+z</text><text x="280.00" y="277.00" fill="#668088" font-size="17" font-weight="500">q = xy+yz+zx</text><text x="510.00" y="277.00" fill="#668088" font-size="17" font-weight="500">r = xyz</text></svg>