name: Validate and publish math-posts
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: math-posts-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check mirrored Skills
        run: python scripts/sync_skills.py --check
      - name: Unit tests
        run: python -m pytest -q
      - name: Audit every question's teaching and formula placement
        run: python scripts/audit_teaching_quality.py --output _audit/teaching-quality.json
      - name: Upload complete per-question teaching quality inventory
        uses: actions/upload-artifact@v4
        with:
          name: question-teaching-quality-audit
          path: _audit/teaching-quality.json
      - name: Audit formula placement in every question and solution step
        run: python scripts/audit_math_rendering.py --output _audit/math-rendering.json
      - name: Upload complete math-rendering and geometry audit
        uses: actions/upload-artifact@v4
        with:
          name: math-rendering-audit
          path: _audit/math-rendering.json
      - name: Build site
        run: python scripts/build_site.py
      - name: Validate links, metadata and article pages
        run: python scripts/validate_site.py
      - name: Audit SVG structure, accessibility and local references
        run: python scripts/audit_svg.py --report _audit/svg-audit.json
      - name: Upload complete SVG audit report
        uses: actions/upload-artifact@v4
        with:
          name: svg-audit-report
          path: _audit/svg-audit.json
      - name: Browser smoke and static 3D fallbacks
        run: python scripts/browser_smoke.py
      - name: Upload validated site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: _site/
          include-hidden-files: true
      # Upload the Pages artifact once in the build job. Rerunning only deploy must
      # never create a second github-pages artifact in the same workflow run.
      - name: Upload Pages deployment artifact
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages workflow source if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "Pages already enabled"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
